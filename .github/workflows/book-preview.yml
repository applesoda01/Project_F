name: 기획 안내서 미리보기
on:
  push:
    branches: [fix_proto_design]
    paths: ['docs/book/**', 'docs/book-v2/**', 'docs/tools/**', '.github/workflows/book-preview.yml']
  pull_request:
    paths: ['docs/book/**', 'docs/book-v2/**', 'docs/tools/**', '.github/workflows/book-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: mdBook 0.4.40 준비
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
      - name: 실제 책 빌드·버전 이동·원본 보존 검사
        run: MDBOOK="$GITHUB_WORKSPACE/mdbook" node --test docs/tools/build-books.test.mjs
      - name: 다운로드용 책 만들기
        run: MDBOOK="$GITHUB_WORKSPACE/mdbook" node docs/tools/build-books.mjs --out dist/book
      - name: HTML 미리보기 보관 (공개 배포 없음)
        uses: actions/upload-artifact@v4
        with:
          name: book-preview-${{ github.sha }}
          path: dist/book
          retention-days: 14
