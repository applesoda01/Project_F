# main 에 반영될 때: 데이터 다시 만들기(바뀌었으면 자동 커밋) → 관문 1 검증 → 최신 빌드 배포
#  - 웹에서 CSV만 고쳐 올려도 data_gen.js 가 자동으로 맞춰진다
#  - 최신 빌드는 GitHub Pages 주소와, Actions 실행 화면의 '최신빌드' 압축 파일 두 곳에 올라간다
name: 최신 빌드
on:
  push:
    branches: [main]
    # 문서/열람 HTML 병합은 저장소 보관만 한다. Pages 배포를 실행하지 않는다.
    paths-ignore:
      - 'docs/**'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: main-build
  cancel-in-progress: true
jobs:
  build:
    # 기능 브랜치에서 수동 실행해도 기존 Pages 전체를 교체하지 않음.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: 게임 그림만 LFS에서 받기
        run: git lfs pull --include "prototype/**"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: CSV 검사·데이터 만들기
        run: python prototype/tools/data_build.py
      - name: data_gen.js 가 바뀌었으면 자동 커밋
        run: |
          if ! git diff --quiet -- prototype/js/data_gen.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prototype/js/data_gen.js
            git commit -m "data_gen.js 자동 갱신 (data/*.csv 반영)"
            git push
          fi
      - name: 관문 1 검증
        run: |
          node prototype/tools/gate1_check.js --md gate1.md || echo '::warning::관문 1 기준을 벗어났습니다. 밸런스 값을 확인해 주세요.'
          cat gate1.md >> "$GITHUB_STEP_SUMMARY"
          node prototype/tools/seed_check.js --md seed.md || echo '::warning::씨앗 고정 검사 결과가 기준과 다릅니다. 의도한 변경이면 seed_check.js --update로 기준을 새로 쓰세요.'
          cat seed.md >> "$GITHUB_STEP_SUMMARY"
      - name: 최신 빌드 압축 파일 (Actions 화면에서 받기)
        uses: actions/upload-artifact@v4
        with:
          name: 최신빌드
          path: prototype
          retention-days: 14
      - name: 기획 안내서 v1·v2 만들기 → 주소/book/
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          MDBOOK="$GITHUB_WORKSPACE/mdbook" node docs/tools/build-books.mjs --out "$GITHUB_WORKSPACE/prototype/book"
      - name: Pages용 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
