<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모험가 프로필 사진 조절</title>
<style>
:root{--ink:#3b2a1e;--muted:#8a735a;--line2:rgba(120,82,44,.5);--wood:#5a3a22}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:#2b2118}
.wrap{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
.ctl{background:#f3e6c8;padding:16px 16px 40px;border-right:3px solid #7a5032;overflow:auto;max-height:100vh}
h1{font-size:19px;margin:0 0 4px;color:var(--wood)}p.d{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
h2{font-size:14px;margin:14px 0 6px;color:var(--wood);border-bottom:1px dashed var(--line2);padding-bottom:4px}
.r{display:grid;grid-template-columns:78px 1fr 50px;align-items:center;gap:8px;margin:5px 0;font-size:13px}.r input[type=range]{width:100%}.r output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
button{font:600 13px inherit;font-family:inherit;color:var(--wood);background:linear-gradient(#fffaf0,#efe0c0);border:2px solid var(--line2);border-radius:9px;padding:5px 10px;cursor:pointer}
textarea{width:100%;height:210px;white-space:pre;overflow:auto;margin-top:8px;font:12px/1.45 ui-monospace,Consolas,monospace;border:2px solid var(--line2);border-radius:8px;padding:8px;background:#fffdf7}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.on{background:linear-gradient(#ffe39a,#f3c25a);border-color:#8a5a22}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.view{padding:14px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;color:#f3e6c8}
.edit{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
canvas#big{border:3px solid #000;background:#ead6ae;cursor:grab;touch-action:none}
.pv{display:flex;flex-direction:column;gap:10px;font-size:12px}.pv canvas{display:block;border:2px solid #7a5032;background:#ead6ae}
.all{display:grid;grid-template-columns:repeat(5,128px);gap:10px}.all div{font-size:12px;text-align:center;cursor:pointer;padding:6px;border-radius:8px;border:2px solid transparent}.all div.on{border-color:#ffd23c;background:rgba(255,210,60,.12)}
.all canvas{border:2px solid #7a5032;border-radius:10px;background:#ead6ae;display:block;margin:0 auto 4px}
.bar{font-size:13px;line-height:1.5}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.ctl{max-height:none}}
</style></head><body><div class="wrap"><div class="ctl">
<h1>프로필 사진 조절</h1>
<p class="d">직업을 고르고, 오른쪽 큰 화면에서 <b>그림을 끌어서</b> 얼굴 위치를 맞추고 <b>휠(또는 슬라이더)</b>로 크기를 맞춥니다. 오른쪽의 작은 미리보기는 게임에서 실제로 보이는 크기입니다. 마음에 들면 <b>값 복사</b> 후 채팅창에 붙여 넣어 주세요.</p>
<h2>어느 사진을 고칠까요?</h2><div class="tabs" id="tabs"></div><h2>직업</h2><div class="r" style="grid-template-columns:78px 1fr"><span>캐릭터</span><select id="chr"></select></div>
<h2>위치 · 크기 <small id="cur"></small></h2>
<div class="r"><span>좌우</span><input type="range" id="sx" min="-60" max="60" step="1" value="0"><output id="ox"></output></div>
<div class="r"><span>상하</span><input type="range" id="sy" min="-60" max="60" step="1" value="0"><output id="oy"></output></div>
<div class="r"><span>크기</span><input type="range" id="sz" min="0.5" max="2" step="0.01" value="1"><output id="oz"></output></div>
<div class="btns"><button id="rs">이 직업 처음 값으로</button><button id="ra">이 사진 전부 처음 값으로</button><button id="cp">상세 값 복사해 오기</button></div>
<div class="ck"><label><input type="checkbox" id="cross" checked> 가운데 십자선 보기</label></div>
<div class="ck"><label><input type="checkbox" id="nudge" checked> 방향키로 1px씩 이동</label></div>
<h2>내보내기</h2><div class="btns"><button id="copy">값 복사</button></div>
<textarea id="out" readonly></textarea>
</div><div class="view"><div class="bar" id="info"></div>
<div class="edit"><canvas id="big" width="416" height="480"></canvas>
<div class="pv"><div>상세 창 (104×120)<canvas id="p1" width="104" height="120" style="border-radius:12px"></canvas></div>
<div>목록 (44, 원형)<canvas id="p2" width="44" height="44" style="border-radius:50%"></canvas></div>
<div>작은 목록 (40, 원형)<canvas id="p3" width="40" height="40" style="border-radius:50%"></canvas></div></div></div>
<div class="all" id="all"></div></div></div>
<script>
// ── 게임 규격 (js/ui.js 의 faceStyle 과 같은 값) ─────────────────────────────
// 세 가지 사진을 따로 맞춥니다: 상세 창(104×120) · 목록 원형(44) · 작은 목록 원형(36)
const MODES = {
  detail: { name: '상세 창 (104×120)', h: 260, cy: 60, bw: 104, bh: 120, circle: false, S: 4, cname: 'FACE_AT' },
  list:   { name: '목록 원형 (44)',     h: 230, cy: 22, bw: 44,  bh: 44,  circle: true,  S: 9, cname: 'FACE_LIST' },
  small:  { name: '작은 목록 원형 (36)', h: 190, cy: 18, bw: 36,  bh: 36,  circle: true,  S: 10, cname: 'FACE_SMALL' }
};
const BASE = { warrior_m:[132,118,1], warrior_f:[161,121,1], archer_m:[148,110,1], archer_f:[152,119,1], mage_m:[145,137,1], mage_f:[158,142,1], cleric_m:[128,116,1], cleric_f:[143,125,1], rogue_m:[132,122,1], rogue_f:[147,128,1] };
const NAMES = { warrior_m:'남 전사', warrior_f:'여 전사', archer_m:'남 궁수', archer_f:'여 궁수', mage_m:'남 마법사', mage_f:'여 마법사', cleric_m:'남 성직자', cleric_f:'여 성직자', rogue_m:'남 도적', rogue_f:'여 도적' };
const ORDER = Object.keys(BASE), clone = o => JSON.parse(JSON.stringify(o));
const DEF = { detail: clone(BASE), list: clone(BASE), small: clone(BASE) };   // 처음 값 (목록·작은 목록은 상세와 같은 값에서 출발)
const FA = clone(DEF), IMG = {};
const $ = id => document.getElementById(id);
let mode = 'detail', cur = 'warrior_m';
ORDER.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = NAMES[k] + ' (' + k + ')'; $('chr').appendChild(o); });
Object.entries(MODES).forEach(([m, d]) => { const b = document.createElement('button'); b.textContent = d.name; b.dataset.m = m; b.onclick = () => { mode = m; draw(); }; $('tabs').appendChild(b); });
const BASES = ['../../prototype/assets/chr/', '../../assets/chr/', '../prototype/assets/chr/', 'prototype/assets/chr/', 'assets/chr/'];
function load(k) { return new Promise(res => { let i = 0; (function t() { if (i >= BASES.length) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => { i++; t(); }; im.src = BASES[i] + `chr_${k}_front.png`; })(); }); }
// 게임의 faceStyle 과 같은 계산: 상자(bw×bh) 안에서 그림 높이 h, 얼굴 중심이 (bw/2, cy) 에 오도록
function paint(c, m, k, S) {
  const M = MODES[m], g = c.getContext('2d'), im = IMG[k], f = FA[m][k]; g.clearRect(0, 0, c.width, c.height); if (!im) return;
  const z = M.h / 470 * f[2]; g.imageSmoothingQuality = 'high';
  g.drawImage(im, Math.round(M.bw / 2 - f[0] * z) * S, Math.round(M.cy - f[1] * z) * S, im.width * z * S, im.height * z * S);
}
function draw() {
  const M = MODES[mode], T = FA[mode], D = DEF[mode], k = cur, f = T[k];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('ox').textContent = f[0] - D[k][0]; $('oy').textContent = f[1] - D[k][1]; $('oz').textContent = f[2].toFixed(2);
  $('sx').value = f[0] - D[k][0]; $('sy').value = f[1] - D[k][1]; $('sz').value = f[2]; $('cur').textContent = NAMES[k] + ' · ' + M.name;
  // 큰 화면: 고르는 사진의 상자를 확대해서 보여 줌 (원형이면 원 밖을 어둡게)
  const big = $('big'); big.width = M.bw * M.S; big.height = M.bh * M.S; const g = big.getContext('2d'); g.clearRect(0, 0, big.width, big.height);
  g.fillStyle = '#ead6ae'; g.fillRect(0, 0, big.width, big.height); paint(big, mode, k, M.S);
  if (M.circle) { g.save(); g.fillStyle = 'rgba(25,15,6,.72)'; g.beginPath(); g.rect(0, 0, big.width, big.height); g.moveTo(big.width, big.height / 2); g.arc(big.width / 2, big.height / 2, big.width / 2, 0, Math.PI * 2); g.closePath(); g.fill('evenodd'); g.restore(); g.strokeStyle = 'rgba(255,230,160,.9)'; g.lineWidth = 2; g.beginPath(); g.arc(big.width / 2, big.height / 2, big.width / 2 - 1, 0, 7); g.stroke(); }
  if ($('cross').checked) { g.strokeStyle = 'rgba(255,0,0,.85)'; g.lineWidth = 1; g.beginPath(); g.moveTo(big.width / 2, 0); g.lineTo(big.width / 2, big.height); g.moveTo(0, big.height / 2); g.lineTo(big.width, big.height / 2); g.stroke(); }
  // 실제 크기 미리보기 3종: 각각 자기 값으로
  paint($('p1'), 'detail', k, 1); paint($('p2'), 'list', k, 1); paint($('p3'), 'small', k, 1);
  document.querySelectorAll('#all div').forEach(e => { e.classList.toggle('on', e.dataset.k === k); const c = e.querySelector('canvas'); c.width = M.bw * (M.circle ? 2 : 1); c.height = M.bh * (M.circle ? 2 : 1); c.style.borderRadius = M.circle ? '50%' : '10px'; c.style.width = (M.circle ? 88 : 104) + 'px'; c.style.height = (M.circle ? 88 : 120) + 'px'; paint(c, mode, k, M.circle ? 2 : 1); });
  $('info').textContent = `${NAMES[k]} · ${M.name} · 얼굴 중심 (${f[0]}, ${f[1]}) · 크기 ${f[2].toFixed(2)}배 · 큰 화면을 끌거나 방향키로 움직여 보세요`;
  out();
}
ORDER.forEach(k => { const d = document.createElement('div'); d.dataset.k = k; d.innerHTML = `<canvas width="104" height="120"></canvas>${NAMES[k]}`; d.onclick = () => { cur = k; $('chr').value = k; draw(); }; $('all').appendChild(d); });
// ── 조작 ─────────────────────────────────────────────────
$('chr').onchange = () => { cur = $('chr').value; draw(); };
$('sx').oninput = () => { FA[mode][cur][0] = DEF[mode][cur][0] + +$('sx').value; draw(); };
$('sy').oninput = () => { FA[mode][cur][1] = DEF[mode][cur][1] + +$('sy').value; draw(); };
$('sz').oninput = () => { FA[mode][cur][2] = +$('sz').value; draw(); };
$('cross').oninput = draw;
let drag = null; const big = $('big');
big.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, f: FA[mode][cur].slice() }; big.setPointerCapture(e.pointerId); big.style.cursor = 'grabbing'; };
big.onpointermove = e => { if (!drag) return; const M = MODES[mode], r = big.getBoundingClientRect(), S = M.S * r.width / big.width, z = M.h / 470 * drag.f[2];
  FA[mode][cur][0] = Math.round(drag.f[0] - (e.clientX - drag.x) / S / z); FA[mode][cur][1] = Math.round(drag.f[1] - (e.clientY - drag.y) / S / z); draw(); };
big.onpointerup = () => { drag = null; big.style.cursor = 'grab'; };
big.onwheel = e => { e.preventDefault(); const f = FA[mode][cur]; f[2] = Math.max(0.5, Math.min(2, +(f[2] * (e.deltaY < 0 ? 1.03 : 0.97)).toFixed(2))); draw(); };
addEventListener('keydown', e => { if (!$('nudge').checked || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; const m = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key]; if (!m) return; e.preventDefault(); FA[mode][cur][0] += m[0]; FA[mode][cur][1] += m[1]; draw(); });
$('rs').onclick = () => { FA[mode][cur] = DEF[mode][cur].slice(); draw(); };
$('ra').onclick = () => { FA[mode] = clone(DEF[mode]); draw(); };
$('cp').onclick = () => { if (mode === 'detail') return; FA[mode][cur] = FA.detail[cur].slice(); draw(); };
function out() {
  const L = m => 'const ' + MODES[m].cname + ' = { ' + ORDER.map(k => `${k}: [${FA[m][k][0]}, ${FA[m][k][1]}${FA[m][k][2] !== 1 ? ', ' + FA[m][k][2] : ''}]`).join(', ') + ' };';
  $('out').value = L('detail') + '\n' + L('list') + '\n' + L('small');
}
$('copy').onclick = () => { $('out').select(); try { document.execCommand('copy'); $('copy').textContent = '복사됨 ✓'; setTimeout(() => $('copy').textContent = '값 복사', 1200); } catch (e) {} };
Promise.all(ORDER.map(async k => IMG[k] = await load(k))).then(() => { if (!IMG[cur]) $('info').textContent = '그림을 찾지 못했습니다. 이 파일을 prototype 폴더 옆(docs/tools)에서 열어 주세요.'; draw(); });
</script></body></html>
