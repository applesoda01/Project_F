<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마을 화면 구성 목업 (쿼터뷰)</title>
<style>
:root{--bg:#1b1410;--pn:#2a1f18;--ln:#4a382a;--tx:#f0e4d2;--ac:#e8b04a;--mu:#a8957e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Malgun Gothic",sans-serif}
#app{display:flex;height:100%}
#side{width:330px;flex:none;overflow:auto;padding:12px 14px;border-left:1px solid var(--ln);background:var(--pn);order:2}
#view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--ln)}
h2{font-size:14px;margin:14px 0 6px;color:var(--ac);border-bottom:1px solid var(--ln);padding-bottom:3px}h2:first-child{margin-top:0}
label{display:flex;gap:6px;align-items:center;margin:2px 0;cursor:pointer}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.st button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:6px 2px;cursor:pointer;font:inherit;line-height:1.25}
.st button.on{background:var(--ac);color:#2a1a08;font-weight:700;border-color:var(--ac)}.st small{display:block;font-size:10px;opacity:.8}
.btn{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:5px 9px;cursor:pointer;font:inherit}
#info{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px;min-height:92px;color:var(--mu)}#info b{color:var(--tx)}
.grid2{columns:2;column-gap:8px}.grid2 label{break-inside:avoid}
</style></head><body><div id="app"><div id="view"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="side">
<h2>마을 단계 (인구)</h2><div class="st" id="stages"></div>
<div style="margin-top:6px;color:var(--mu)" id="stinfo"></div>
<h2>핵심 건물 (특별 퀘스트로 생김)</h2><div class="grid2" id="core"></div>
<div style="color:var(--mu);margin-top:4px">체크 = 퀘스트 달성. 단계가 부족하면 체크해도 나오지 않습니다.</div>
<h2>연출</h2>
<label><input type="checkbox" id="inv"> 침공 중 (시간이 흐르는 상태)</label>
<label><input type="checkbox" id="rum" checked> 소문 말풍선 자리</label>
<label><input type="checkbox" id="path"> 모험가 동선</label>
<h2>보기</h2>
<label><input type="checkbox" id="slots"> 슬롯 발자국·번호</label>
<label><input type="checkbox" id="grid"> 격자(타일 좌표)</label>
<label><input type="checkbox" id="safe"> UI 안전 영역 (HUD·메뉴·대화창)</label>
<h2>선택한 슬롯</h2><div id="info">건물을 클릭하면 정보가 나옵니다.</div>
<div style="margin-top:10px;color:var(--mu);font-size:12px">시점: 2:1 아이소메트릭. 타일 100×50px, 격자 16×16, 원점(0,0) 꼭짓점 = 화면 (960, 190)</div>
</div></div>
<script>
const TW=100,TH=58,N=16,X0=960,Y0=300;
const STAGES=[["개척촌", "~300", "×1.0"], ["마을", "300~1,000", "×1.3"], ["읍", "1,000~3,000", "×1.6"], ["도시", "3,000~8,000", "×2.0"], ["성채 도시", "8,000~", "×2.5"]],SL=[{"id": "guild", "name": "길드 본관", "kind": "guild", "grp": "guild", "gx": 7, "gy": 7, "w": 2, "d": 2, "h": 96, "top": 250, "stage": 0, "req": "항상"}, {"id": "church", "name": "성당", "kind": "church", "grp": "core", "gx": 9, "gy": 3, "w": 2, "d": 2, "h": 70, "top": 190, "stage": 0, "req": "특별 퀘스트(D) 주교 구출", "up": "cathedral"}, {"id": "cathedral", "name": "대성당", "kind": "cathedral", "grp": "core", "gx": 9, "gy": 3, "w": 2, "d": 2, "h": 90, "top": 250, "stage": 3, "req": "성당 + 도시 단계 + 2번째 특별 퀘스트(A)", "replaces": "church"}, {"id": "magic", "name": "마법 학원", "kind": "academy", "grp": "core", "gx": 9, "gy": 1, "w": 2, "d": 2, "h": 70, "top": 200, "stage": 1, "req": "특별 퀘스트(C) 폭주 실험체", "up": "tower"}, {"id": "tower", "name": "마탑", "kind": "mtower", "grp": "core", "gx": 9, "gy": 1, "w": 2, "d": 2, "h": 60, "top": 330, "stage": 3, "req": "마법 학원 + 도시 단계 + 2번째 특별 퀘스트(A)", "replaces": "magic"}, {"id": "observ", "name": "천문대", "kind": "observ", "grp": "core", "gx": 9, "gy": 5, "w": 2, "d": 2, "h": 110, "top": 190, "stage": 2, "req": "특별 퀘스트(B) 별이 떨어진 자리"}, {"id": "theater", "name": "극장", "kind": "theater", "grp": "core", "gx": 11, "gy": 3, "w": 2, "d": 2, "h": 80, "top": 150, "stage": 2, "req": "특별 퀘스트(B) 저주받은 가희"}, {"id": "library", "name": "대도서관", "kind": "library", "grp": "core", "gx": 11, "gy": 1, "w": 2, "d": 2, "h": 84, "top": 150, "stage": 2, "req": "탐사 특별 퀘스트로 발견 (전설)"}, {"id": "arena", "name": "투기장", "kind": "arena", "grp": "core", "gx": 3, "gy": 9, "w": 2, "d": 2, "h": 70, "top": 110, "stage": 1, "req": "특별 퀘스트(C) 떠돌이 검투사단"}, {"id": "dojo", "name": "수련원", "kind": "dojo", "grp": "core", "gx": 11, "gy": 5, "w": 2, "d": 2, "h": 48, "top": 110, "stage": 1, "req": "특별 퀘스트(C) 산중의 노사부"}, {"id": "hunter", "name": "사냥꾼 조합", "kind": "hunter", "grp": "core", "gx": 5, "gy": 9, "w": 2, "d": 2, "h": 52, "top": 120, "stage": 0, "req": "특별 퀘스트(D) 거대 짐승 사냥"}, {"id": "alchemy", "name": "연금 공방", "kind": "alchemy", "grp": "core", "gx": 5, "gy": 11, "w": 2, "d": 2, "h": 56, "top": 170, "stage": 2, "req": "특별 퀘스트(B) 연금술사의 유산"}, {"id": "watch", "name": "망루", "kind": "watch", "grp": "core", "gx": 14, "gy": 14, "w": 1, "d": 1, "h": 120, "top": 190, "stage": 0, "req": "특별 퀘스트(D) 산적 두목 추적"}, {"id": "castle", "name": "영주의 성", "kind": "castle", "grp": "castle", "gx": 3, "gy": 3, "w": 4, "d": 4, "h": 190, "top": 330, "stage": 0, "req": "항상 (단계에 따라 성장)"}, {"id": "inn", "name": "여관", "kind": "inn", "grp": "gen", "gx": 3, "gy": 11, "w": 2, "d": 2, "h": 70, "top": 140, "stage": 0, "req": "개척촌"}, {"id": "potion", "name": "물약 상점", "kind": "potion", "grp": "gen", "gx": 9, "gy": 9, "w": 2, "d": 2, "h": 48, "top": 110, "stage": 1, "req": "마을 단계"}, {"id": "weapon", "name": "무기점", "kind": "weapon", "grp": "gen", "gx": 11, "gy": 9, "w": 2, "d": 2, "h": 48, "top": 110, "stage": 1, "req": "마을 단계"}, {"id": "smith", "name": "대장간", "kind": "smith", "grp": "gen", "gx": 9, "gy": 11, "w": 2, "d": 2, "h": 50, "top": 150, "stage": 1, "req": "마을 단계"}],HS=[[11, 11, 1, 2, 1], [3, 0, 1, 1, 0], [0, 3, 1, 1, 1], [14, 10, 1, 1, 3], [12, 14, 1, 1, 0], [12, 11, 2, 1, 3], [0, 10, 2, 1, 2], [14, 3, 2, 1, 0], [3, 14, 2, 2, 3], [9, 6, 3, 2, 3], [11, 12, 3, 1, 2], [12, 0, 3, 1, 3], [0, 5, 3, 2, 0], [14, 12, 3, 1, 1], [10, 14, 3, 2, 0], [12, 12, 4, 2, 0], [0, 12, 4, 2, 3], [14, 5, 4, 2, 1], [5, 14, 4, 2, 2]],RUM=[[8, 5], [5, 8], [8, 11], [11, 8], [7, 13], [13, 7], [2, 8], [8, 2]],PATHS=[[[8, 15.9], [8, 9]], [[15.9, 8], [9, 8]], [[8, 13], [2.5, 13], [2.5, 2.5]]];
const cv=document.getElementById('c'),g=cv.getContext('2d');const $=id=>document.getElementById(id);
let stage=2,done={},sel=null,T=0;
let O='#4a3426';
const sx=(a,b)=>X0+(a-b)*TW/2, sy=(a,b)=>Y0+(a+b)*TH/2;
const Z=(a,b,z=0)=>[sx(a,b),sy(a,b)-z];
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k>=0?v+(255-v)*k:v*(1+k))));return `rgb(${f(r)},${f(gg)},${f(b)})`}
function poly(pts,fill,lw=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(lw){g.lineWidth=lw;g.strokeStyle=O;g.lineJoin='round';g.stroke()}}
function ell(x,y,rx,ry,fill,lw=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);if(fill){g.fillStyle=fill;g.fill()}if(lw){g.lineWidth=lw;g.strokeStyle=O;g.stroke()}}
const pal={cream:'#efe1c3',stone:'#cfc8ba',wood:'#b98d5c',timber:'#5a3a26',slate:'#566681',brown:'#7a4a3a',red:'#a8574a',green:'#5f8f4a',plum:'#7e5a8e',teal:'#4f8f8a',blue:'#4f6f9e',gold:'#dfa83c',dark:'#6a4a38'};
const ROOFS=[pal.brown,pal.red,pal.slate,'#5d4a3f'];
// 면 위의 점: P0,P1 = 지면 모서리(화면), t 가로 0~1, z 높이
const fp=(P0,P1,t,z)=>[P0[0]+(P1[0]-P0[0])*t,P0[1]+(P1[1]-P0[1])*t-z];
function faceQuad(P0,P1,t1,t2,z1,z2){return[fp(P0,P1,t1,z1),fp(P0,P1,t2,z1),fp(P0,P1,t2,z2),fp(P0,P1,t1,z2)]}
function winF(P0,P1,t,z,tw,wh){poly(faceQuad(P0,P1,t-tw/2,t+tw/2,z,z+wh),'#d7ebf0',1.6)}
function doorF(P0,P1,t,tw,dh,c=pal.dark){poly(faceQuad(P0,P1,t-tw/2,t+tw/2,0,dh),c,1.8)}
function timberF(P0,P1,h,n){g.save();g.strokeStyle='rgba(74,52,38,.55)';g.lineWidth=2;for(let i=1;i<n;i++){const a=fp(P0,P1,i/n,0),b=fp(P0,P1,i/n,h);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}const a=fp(P0,P1,0,h*.55),b=fp(P0,P1,1,h*.55);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.restore()}
// 상자 (벽만)
function box(x,y,w,d,h,wall,o={}){
 const D=Z(x,y+d),C=Z(x+w,y+d),B=Z(x+w,y);
 poly(faceQuad(D,C,0,1,0,h),shade(wall,.0),2);poly(faceQuad(C,B,0,1,0,h),shade(wall,-.18),2);
 if(o.timber){timberF(D,C,h,Math.max(2,Math.round(w*2)));timberF(C,B,h,Math.max(2,Math.round(d*2)))}
 return{D,C,B}}
// 맞배지붕 집. ridge 'x': 능선이 gx 방향, 'y': gy 방향
function gbox(o){const{x,y,w,d,h,rh,ridge='x',wall=pal.cream,roof=pal.brown,timber=true}=o;
 const A=Z(x,y,h),B=Z(x+w,y,h),C=Z(x+w,y+d,h),D=Z(x,y+d,h);
 let R1,R2;
 if(ridge==='x'){R1=Z(x,y+d/2,h+rh);R2=Z(x+w,y+d/2,h+rh);poly([A,B,R2,R1],shade(roof,-.25),2)}
 else{R1=Z(x+w/2,y,h+rh);R2=Z(x+w/2,y+d,h+rh);poly([A,D,R2,R1],shade(roof,-.25),2)}
 const b=box(x,y,w,d,h,wall,{timber});
 if(ridge==='x'){poly([B,C,R2],shade(wall,-.18),2);poly([D,C,R2,R1],roof,2);// 앞 경사
   g.save();g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1.5;for(let i=1;i<4;i++){const t=i/4,p=[D[0]+(R1[0]-D[0])*t,D[1]+(R1[1]-D[1])*t],q=[C[0]+(R2[0]-C[0])*t,C[1]+(R2[1]-C[1])*t];g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}g.restore()}
 else{poly([D,C,R2],shade(wall,0),2);poly([B,C,R2,R1],shade(roof,-.12),2);
   g.save();g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1.5;for(let i=1;i<4;i++){const t=i/4,p=[B[0]+(R1[0]-B[0])*t,B[1]+(R1[1]-B[1])*t],q=[C[0]+(R2[0]-C[0])*t,C[1]+(R2[1]-C[1])*t];g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}g.restore()}
 return{D:b.D,C:b.C,B:b.B,R1,R2}}
function pyramid(x,y,w,d,h,rh,roof){const D=Z(x,y+d,h),C=Z(x+w,y+d,h),B=Z(x+w,y,h),Ap=Z(x+w/2,y+d/2,h+rh);poly([D,C,Ap],roof,2);poly([C,B,Ap],shade(roof,-.2),2)}
function tower(x,y,s,h,rh,wall,roof){const b=box(x,y,s,s,h,wall,{timber:false});pyramid(x-.05,y-.05,s+.1,s+.1,h,rh,roof);return b}
function cross(px,py,s=1){g.save();g.strokeStyle=pal.gold;g.lineWidth=4*s;g.beginPath();g.moveTo(px,py);g.lineTo(px,py-26*s);g.moveTo(px-9*s,py-18*s);g.lineTo(px+9*s,py-18*s);g.stroke();g.restore()}
function flag(px,py,hh,c){g.beginPath();g.moveTo(px,py);g.lineTo(px,py-hh);g.lineWidth=3;g.strokeStyle=O;g.stroke();poly([[px,py-hh],[px+30,py-hh+9],[px,py-hh+19]],c,2)}
function smoke(px,py,col,n=4){g.save();for(let i=0;i<n;i++){const k=(T*.5+i/n)%1;g.globalAlpha=(1-k)*.7;ell(px+Math.sin(k*5+i)*7,py-k*54,7+k*11,6+k*9,col,0)}g.restore()}
function label(px,py,txt,c=pal.gold){g.save();g.font='700 14px sans-serif';const w=g.measureText(txt).width+14;poly([[px-w/2,py-11],[px+w/2,py-11],[px+w/2,py+11],[px-w/2,py+11]],c,2);g.fillStyle=O;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,px,py+1);g.restore()}
function cyl(cx,cy,rx,ry,h,wall,topc){g.beginPath();g.moveTo(cx-rx,cy-h);g.lineTo(cx-rx,cy);g.ellipse(cx,cy,rx,ry,0,Math.PI,0,true);g.lineTo(cx+rx,cy-h);g.closePath();g.fillStyle=wall;g.fill();g.lineWidth=2;g.strokeStyle=O;g.stroke();ell(cx,cy-h,rx,ry,topc,2)}
const KINDS={
 castle(){castleIn()},
 house(o){const h=o.fl==2?58:40;gbox({x:o.x+.12,y:o.y+.12,w:.76,d:.76,h,rh:o.fl==2?26:24,ridge:o.v%2?'y':'x',roof:ROOFS[o.v%4]});},
 guild(o){const x=o.x,y=o.y;gbox({x,y,w:2,d:2,h:90,rh:40,ridge:'x',roof:pal.slate});
  const t=box(x+.5,y+.5,1,1,150,pal.cream,{timber:true});pyramid(x+.42,y+.42,1.16,1.16,150,56,pal.slate);const Ap=Z(x+1,y+1,206);flag(Ap[0],Ap[1],44,pal.gold);

 academy(o){const x=o.x,y=o.y;gbox({x,y:y+.2,w:2,d:1.8,h:62,rh:24,ridge:'x',roof:pal.plum,wall:pal.cream});
  const t=box(x+.6,y+.5,.8,.8,110,pal.stone,{timber:false});const c=Z(x+1,y+.9,110);ell(c[0],c[1],40,22,pal.plum,2.5);g.beginPath();g.ellipse(c[0],c[1],40,22,0,Math.PI,0,true);g.fillStyle=pal.plum;g.fill();g.stroke();
  poly([[c[0],c[1]-60],[c[0]+6,c[1]-24],[c[0]-6,c[1]-24]],pal.gold,2);doorF(Z(x,y+2),Z(x+2,y+2),.5,.18,34)},
 mtower(o){const x=o.x,y=o.y;box(x+.1,y+.5,1.8,1.4,40,pal.stone,{timber:false});const t=box(x+.5,y+.5,1,1,230,pal.stone,{timber:false});pyramid(x+.4,y+.4,1.2,1.2,230,80,pal.plum);
