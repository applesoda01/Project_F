<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>하단 HUD 조절기</title>
<style>
:root{--wood:#3a2618;--wood2:#5a3a22;--cream:#fbf1dc;--gold:#e8b44a;--ink:#3b2a1e;--muted:#8a7258}
.plate{position:absolute;background:linear-gradient(#fff8e8,#f3e3c2);color:var(--ink);border:4px solid var(--wood2);border-radius:18px;box-shadow:0 6px 0 rgba(58,38,24,.55),0 10px 24px rgba(0,0,0,.25)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 16px;background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:rgba(90,58,34,.12)}
.btn.on{background:var(--wood2);color:#fff3d6}
#hudBR{position:absolute;right:22px;bottom:14px;--h:100;--ic:52px;--icy:-4px;--mbw:88px;--mfs:17px;--bgap:6px;--py:8px;height:calc(var(--h)*1px);display:flex;align-items:center;color:var(--ink);z-index:5;padding:0;gap:0;background:none;border:0;box-shadow:none}
#hudBR .pm{position:absolute;top:0;bottom:0;left:round(calc(var(--h)*0.5626px),1px);right:round(calc(var(--h)*0.5626px),1px);background:url(../../prototype/assets/ui/hud/plaque_box_mid.png) 0 0/100% 100% no-repeat}
#hudBR .pl,#hudBR .pr{z-index:1;position:absolute;top:0;height:100%;width:round(calc(var(--h)*0.5626px),1px);background:url(../../prototype/assets/ui/hud/plaque_box.png) no-repeat;background-size:auto 100%}
#hudBR .pl{left:0;background-position:left top}#hudBR .pr{right:0;background-position:right top}
#hudBR .in{z-index:2;position:relative;display:flex;align-items:center;gap:var(--bgap);height:calc(100% - 6px);padding:0 calc(var(--h)*.31px) var(--py)}
#hudBR .sep{width:3px;height:56px;border-radius:2px;background:rgba(90,58,34,.28);margin:0 4px}
#hudBR .grp{position:relative;display:block}
#hudBR .up{display:flex;flex-direction:column;position:absolute;left:50%;bottom:calc(100% + 18px);min-width:190px;padding:8px;z-index:8;opacity:0;visibility:hidden;transform:translate(-50%,10px);transition:opacity .15s ease .3s,transform .18s ease .3s,visibility 0s linear .48s}
#hudBR .up::after{content:"";position:absolute;left:0;right:0;top:100%;height:26px} /* 마우스가 틈을 지나도 닫히지 않게 이어줌 */
#hudBR .grp:hover .up,#hudBR .grp:focus-within .up{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .15s ease .12s,transform .18s cubic-bezier(.2,.9,.3,1.2) .12s,visibility 0s}
#hudBR .up .btn{text-align:left;font-weight:600;white-space:nowrap;padding:10px 16px}
#hudBR .grp:last-child .up{left:auto;right:-6px;transform:translate(0,10px)}
#hudBR .grp:last-child:hover .up,#hudBR .grp:last-child:focus-within .up{transform:none}
#hudBR .up #mReport{display:flex;justify-content:space-between;gap:18px}
#hudBR .mb{white-space:nowrap}
#hudBR .up .btn:hover{background:rgba(90,58,34,.12)}
#hudBR .up i{font-style:normal;float:right;margin-left:14px;color:var(--muted)}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--mbw);padding:8px 4px 6px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:var(--mfs);font-weight:700;cursor:pointer}
.mb:hover{background:rgba(90,58,34,.12)}.mb.on{background:var(--wood2);color:#fff3d6}
.mb svg{width:38px;height:38px}
.mb .ic{width:var(--ic);height:var(--ic);display:block;margin:var(--icy) 0 -2px;pointer-events:none}
.mb .cnt[hidden]{display:none}
.mb .cnt{position:absolute;right:10px;top:2px;min-width:26px;height:26px;border-radius:13px;background:#c0392b;color:#fff;font-size:15px;display:grid;place-items:center;padding:0 6px}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#2b2018;color:#fbf1dc}
#stage{position:relative;height:300px;background:linear-gradient(#e7b872,#d29a52);overflow:hidden}
#stage #hudBR{right:50%;transform:translateX(50%);bottom:90px}
#hudBR .up{display:none}
.panel{padding:16px 24px;display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:10px 36px}
.panel label{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:15px}
.panel input[type=range]{width:100%}
textarea{width:calc(100% - 48px);margin:0 24px 24px;height:150px;background:#1b130d;color:#fbf1dc;border:1px solid #6b4a2e;padding:10px;font:13px/1.5 Consolas,monospace}
button.copy{margin:0 24px 12px;padding:8px 18px;font:inherit;font-weight:700;background:#e8b44a;border:0;border-radius:8px;cursor:pointer}
</style></head><body>
<div id="stage">  <div id="hudBR"><i class="pm"></i><i class="pl"></i><i class="pr"></i><div class="in">
    <button class="mb" data-pop="board"><img class="ic" src="../../prototype/assets/ui/hud/bt/board.png" alt="" draggable="false">의뢰<span class="cnt" id="bBoard"></span></button>
    <button class="mb" data-pop="advs"><img class="ic" src="../../prototype/assets/ui/hud/bt/advs.png" alt="" draggable="false">모험가<span class="cnt" id="bParty"></span></button>
    <button class="mb" data-pop="fac"><img class="ic" src="../../prototype/assets/ui/hud/bt/fac.png" alt="" draggable="false">시설</button>
    <span class="grp"><button class="mb" id="mgBtn"><img class="ic" src="../../prototype/assets/ui/hud/bt/mgmt.png" alt="" draggable="false">경영</button>
      </span>
    <button class="mb" data-act="town" title="마을 화면으로 이동"><img class="ic" src="../../prototype/assets/ui/hud/bt/town.png" alt="" draggable="false">마을</button>
    <i class="sep"></i>
    <span class="grp"><button class="mb" id="menuBtn"><img class="ic" src="../../prototype/assets/ui/hud/bt/opt.png" alt="" draggable="false">옵션</button>
      </span>
  </div></div>
</div>
<div class="panel" id="panel"></div>
<button class="copy" id="copy">값 복사</button>
<textarea id="out" readonly></textarea>
<script>
const P=[['h','패널 높이','--h',100,70,140,1,''],['ic','아이콘 크기','--ic',52,30,90,1,'px'],['icy','아이콘 위아래','--icy',-4,-20,20,1,'px'],['mbw','버튼 폭','--mbw',88,60,130,1,'px'],['mfs','글자 크기','--mfs',17,12,24,1,'px'],['bgap','버튼 간격','--bgap',6,0,24,1,'px'],['py','아래 여백','--py',8,0,30,1,'px']];
const hud=document.getElementById('hudBR'),pn=document.getElementById('panel'),out=document.getElementById('out');
const val={};
P.forEach(p=>{const l=document.createElement('label');l.innerHTML='<span>'+p[1]+'</span><input type="range" min="'+p[4]+'" max="'+p[5]+'" step="'+p[6]+'" value="'+p[3]+'"><b>'+p[3]+'</b>';const r=l.querySelector('input'),b=l.querySelector('b');r.oninput=()=>{b.textContent=r.value;val[p[0]]=+r.value;apply()};val[p[0]]=p[3];pn.appendChild(l)});
function apply(){P.forEach(p=>hud.style.setProperty(p[2],val[p[0]]+p[7]));out.value=JSON.stringify(val)+'\n\n'+P.map(p=>p[2]+':'+val[p[0]]+p[7]).join(';')+';'}
document.querySelectorAll('.cnt').forEach((c,i)=>{c.hidden=false;c.textContent=i?'★1':'2'});apply();document.getElementById('copy').onclick=()=>{out.select();document.execCommand('copy')};
</script></body></html>
