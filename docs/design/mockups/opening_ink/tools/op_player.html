<title>오프닝 잉크 패럴렉스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#15120e;--panel:#211c16;--line:#3a3127;--fg:#efe6d6;--mute:#a8987f;--accent:#d9a65a;--paper:#e9dcc3;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1{font-family:"Nanum Myeongjo",serif;font-weight:700;font-size:clamp(20px,3vw,28px);margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:0}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;border:1px solid var(--line);border-radius:6px}
.ly{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.ly img{position:absolute;display:block;max-width:none;user-select:none;pointer-events:none}
.ly.bgl img{left:-6%;top:-6%;width:112%;height:112%;object-fit:cover}
.debug .ly:not(.bgl) img{outline:2px dashed var(--accent)}
.debug .ly.bgl{filter:brightness(.55)}
.fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none}
.flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:"Nanum Myeongjo",serif;font-size:clamp(13px,2.1vw,22px);color:#f5ecdc;text-shadow:0 1px 3px #000,0 0 12px #000;padding:0 8%;opacity:0;transition:opacity .4s}
.tag{position:absolute;left:10px;top:8px;font-size:12px;color:#f5ecdc;background:#000a;padding:2px 8px;border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button.main{background:var(--accent);color:#1b140b;border-color:var(--accent);font-weight:600}
.note{font-size:13px;color:var(--mute);line-height:1.6;max-width:70ch}
.note b{color:var(--fg)}
</style>
<div class="wrap">
  <h1>오프닝 v2 · 잉크 화풍 2.5D 패럴렉스 미리보기</h1>
  <p class="sub">밤사이 생성한 레이어로 만든 가편집입니다. 소리 없음 · 13컷 약 52초. 컷 번호를 누르면 그 컷만 반복합니다.</p>
  <div class="stage" id="st"><div id="lys"></div><div class="flash" id="fl"></div><div class="cap" id="cap"></div><div class="fade" id="fd"></div><div class="tag" id="tag">—</div></div>
  <div class="bar" id="bar"><button class="main" id="all">▶ 처음부터 재생</button></div>
  <div class="bar"><button id="dbg">레이어 경계 보기</button><button id="spd">속도 1×</button></div>
  <p class="note"><b>보는 법</b> · 배경(뒤)은 조금, 인물 · 앞 소품은 많이 움직여 깊이가 생깁니다. 「레이어 경계 보기」를 켜면 잘라 낸 레이어의 테두리가 점선으로 보입니다.</p>
</div>
<script>
const SH=/*CFG*/[];
const st=document.getElementById('st'),lys=document.getElementById('lys'),cap=document.getElementById('cap'),fd=document.getElementById('fd'),fl=document.getElementById('fl'),tag=document.getElementById('tag');
let cur=null,t0=0,mode='all',idx=0,speed=1,raf=0;
const bar=document.getElementById('bar');
SH.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.dataset.i=i;b.onclick=()=>{mode='one';play(i)};bar.appendChild(b)});
document.getElementById('all').onclick=()=>{mode='all';play(0)};
document.getElementById('dbg').onclick=e=>{st.classList.toggle('debug');e.target.classList.toggle('on')};
document.getElementById('spd').onclick=e=>{speed=speed===1?0.5:speed===0.5?2:1;e.target.textContent='속도 '+speed+'×'};
// preload
SH.forEach(s=>s.L.forEach(l=>{const im=new Image();im.src='layers/'+l.f}));
function build(s){
  lys.innerHTML='';
  s.L.forEach(l=>{
    const d=document.createElement('div');d.className='ly'+(l.bg?' bgl':'');const im=document.createElement('img');im.src='layers/'+l.f;im.alt='';
    if(!l.bg){
      if(l.cover){im.style.cssText='left:-4%;top:-4%;width:108%;height:108%;object-fit:cover'}
      else{const H=l.h, Wp=H*l.ar*9/16; im.style.height=H+'%';im.style.width=Wp+'%';im.style.left=(l.x-Wp/2)+'%';im.style.top=(l.y-H)+'%'}
      if(l.flip)im.style.transform='scaleX(-1)';
    }
    d.appendChild(im);d._l=l;lys.appendChild(d);
  });
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(now){
  const s=SH[idx];const dur=s.dur*1000/speed;let t=(now-t0)/dur;
  if(t>=1){ if(mode==='all'&&idx<SH.length-1){play(idx+1);return} if(mode==='one'){play(idx);return} t=1 }
  const e=ease(Math.min(1,t)),k=s.cam;
  for(const d of lys.children){const D=d._l.d;let sc=1,tx=0,ty=0,f='';
    if(k==='push'){sc=1+0.12*e*D}
    else if(k==='pull'){sc=1+0.14*(1-e)*D}
    else if(k==='up'){ty=(e-0.5)*7*D;sc=1+0.04*e*D}
    else if(k==='side'){tx=-(e-0.5)*7*D;sc=1.02+0.03*e*D}
    else if(k==='wake'){sc=1.04+0.04*e;const bl=10*(1-e)+1.2;const br=0.25+0.6*e*(0.75+0.25*Math.abs(Math.sin(e*7)));f=`blur(${bl}px) brightness(${br})`}
    d.style.transform=`translate(${tx}%,${ty}%) scale(${sc})`;d.style.filter=f;}
  fl.style.opacity=k==='flash'?(t<0.35?t/0.35:Math.max(0,1-(t-0.55)/0.45)):0;
  if(k==='flash'&&t<0.35)lys.style.opacity=1;
  const edge=Math.min(t,1-t)*dur;fd.style.opacity=k==='flash'?0:Math.max(0,1-edge/280);
  if(t<1)raf=requestAnimationFrame(frame);
}
function play(i){
  cancelAnimationFrame(raf);idx=i;const s=SH[i];
  if(s.L.length||s.cam!=='flash')build(s);
  tag.textContent=s.n+'번 · '+({push:'밀고 들어감',pull:'뒤로 빠짐',up:'위로',side:'옆으로',flash:'하얗게',wake:'깨어남'}[s.cam]);
  cap.textContent=s.tx;cap.style.opacity=s.tx?1:0;
  [...bar.querySelectorAll('button[data-i]')].forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  t0=performance.now();raf=requestAnimationFrame(frame);
}
build(SH[0]);fd.style.opacity=0;tag.textContent='▶를 눌러 재생';
</script>
