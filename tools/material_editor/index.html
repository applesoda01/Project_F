<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소재 편집기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 탭 + 좌측 목록(소재는 계열×등급 표) + 우측 상세 패널 + 하단 점검 줄 */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#1c2430; --muted:#667085; --line:#d6dbe3; --soft:#f5f7fa;
  --accent:#b4581c; --accent-ink:#ffffff; --focus:#2563eb; --warn:#a15c00; --bad:#b42318; --ok:#1d7a46;
  --g-F:#7c8594; --g-E:#3f8f5b; --g-D:#2f6fb5; --g-C:#7a4fb0; --g-B:#c06a14; --g-A:#c0392b; --g-S:#a8860a;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --panel:#1b212a; --ink:#e7ebf1; --muted:#98a2b3; --line:#2f3743; --soft:#222a35;
    --accent:#e0873f; --accent-ink:#1a1209; --focus:#6aa0ff; --warn:#e5a23a; --bad:#f08a80; --ok:#5cc58a;
    --g-F:#9aa3b2; --g-E:#5cc58a; --g-D:#6aa8ee; --g-C:#a98be0; --g-B:#e59a4a; --g-A:#ef7d70; --g-S:#d9b93f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1b212a; --ink:#e7ebf1; --muted:#98a2b3; --line:#2f3743; --soft:#222a35;
  --accent:#e0873f; --accent-ink:#1a1209; --focus:#6aa0ff; --warn:#e5a23a; --bad:#f08a80; --ok:#5cc58a;
  --g-F:#9aa3b2; --g-E:#5cc58a; --g-D:#6aa8ee; --g-C:#a98be0; --g-B:#e59a4a; --g-A:#ef7d70; --g-S:#d9b93f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:1500px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .n{font-size:12px;opacity:.8;margin-left:5px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.saved{font-size:11.5px;color:var(--muted);flex-basis:100%;text-align:right}
.fstat{font-size:12.5px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;margin-right:4px}
.fstat .p{color:var(--muted);font-size:11.5px}
.fstat .dirty{color:var(--warn);font-weight:600}.fstat .clean{color:var(--ok);font-weight:600}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg[hidden]{display:none}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlgbox h3{margin:0 0 10px;font-size:16px}
.cmp{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}.cmp th,.cmp td{border:1px solid var(--line);padding:4px 8px;text-align:right}.cmp th:first-child,.cmp td:first-child{text-align:left}.cmp th{color:var(--muted);font-weight:600}

.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.side{position:sticky;top:12px}
.panel h2{margin:0 0 10px;font-size:14px}
.hint{color:var(--muted);font-size:12.5px}

/* 소재 표 */
.matrix-scroll{overflow-x:auto}
table.matrix{border-collapse:separate;border-spacing:6px;width:100%;min-width:760px}
.matrix th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:center;padding:2px 0}
.matrix th.g{width:44px;font-weight:700}
.cell{width:100%;min-height:78px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cell:hover{border-color:var(--accent)}
.cell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--panel)}
.cell .nm{font-size:12.5px;line-height:1.25;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ico{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--gc,var(--g-F));overflow:hidden;flex:none}
.ico img{width:100%;height:100%;object-fit:contain;background:var(--soft)}
.ico.lg{width:112px;height:112px;font-size:34px;border-radius:12px}
.gl{display:inline-block;min-width:22px;text-align:center;border-radius:5px;padding:0 5px;color:#fff;background:var(--gc,var(--g-F));font-size:12px;font-weight:700}
[data-g="F"]{--gc:var(--g-F)}[data-g="E"]{--gc:var(--g-E)}[data-g="D"]{--gc:var(--g-D)}[data-g="C"]{--gc:var(--g-C)}
[data-g="B"]{--gc:var(--g-B)}[data-g="A"]{--gc:var(--g-A)}[data-g="S"]{--gc:var(--g-S)}
.extra-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 8px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--panel)}
.chip .t{min-width:0}
.chip .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .t span{font-size:11.5px;color:var(--muted)}

/* 항목 목록 */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px;text-align:left}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--panel)}
.card .top{display:flex;gap:8px;align-items:center}
.card .top b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini .ico{width:24px;height:24px;font-size:11px;border-radius:5px}
.mini .x{margin-right:4px}
.incomplete{color:var(--warn);font-size:12px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qcell{align-items:stretch;text-align:left;min-height:96px}
.cellstack{display:flex;flex-direction:column;gap:4px}.cellstack .qcell{min-height:0}
.addc{border:1px dashed var(--line);background:transparent;border-radius:7px;padding:3px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}.addc:hover{border-color:var(--accent);color:var(--accent)}.qcell .nm{font-weight:500;text-align:center}
.rwi{justify-content:center;gap:5px 4px}.rwc{display:flex;flex-direction:column;align-items:center;gap:1px}.rwc em{font-style:normal;font-size:10.5px;color:var(--muted)}
.rwc.main .ico{box-shadow:0 0 0 2px var(--accent)}.rwc.main em{color:var(--accent);font-weight:700}
.rwl{display:grid;gap:1px;font-size:11.5px;line-height:1.35}.rwr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px}
.rwr i{font-style:normal;color:var(--muted)}.rwr.r-m{font-weight:700}.rwr.r-m i{color:var(--accent)}.rwr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rwr em{font-style:normal;color:var(--muted)}
.rw{display:grid;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px;margin-bottom:6px}
.rw .btn{white-space:nowrap;padding:6px 10px}.rw .row select{flex:1}.rw input[type=number]{width:76px;flex:none}.rw select{min-width:0}

/* 상세 */
.field{display:grid;gap:4px;margin-bottom:10px}
.field>label,.lbl{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 9px}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center}
.icobox{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.drop{cursor:pointer;border:2px dashed transparent;border-radius:14px}
.drop.over{border-color:var(--accent)}
.badge{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.badge.core{border-color:var(--accent);color:var(--accent)}
.slot{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:6px;align-items:center;margin-bottom:6px}
.slot .no{color:var(--muted);text-align:center}
.usedby{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.usedby button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:1px 8px;font-size:12px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg{font-size:12.5px;margin-top:8px}
.qsub{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;margin:2px 0 14px}
.qsub button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.qsub button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.qsub button .soon{font-size:10.5px;opacity:.75;margin-left:4px;font-weight:400}
.fixed{padding:6px 0}
.cnt{font-size:11.5px;color:var(--muted);text-align:right}
.rules{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px;margin-bottom:14px}
.rules summary{cursor:pointer;font-weight:600;font-size:13.5px}
.rules .rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px;margin:10px 0}
.rules .rg label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.rules .rg input[type=number]{padding:5px 7px}
.brw{border-top:1px dashed var(--line);padding-top:10px;margin:4px 0 10px}
.brg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.brg label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.brg label>span{display:flex;align-items:center;gap:4px}
.brg input{padding:5px 6px;text-align:right}
.brg label.chg input{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.brg label.chg small{color:var(--warn)}
@media (max-width:700px){.brg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.simt{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
.simt th,.simt td{border:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}
.simt th{background:var(--panel);font-weight:600;color:var(--muted)}
.simt td.base{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
.simt td.capd{color:var(--warn)}
.simt td.na{color:var(--muted);text-align:center}
.calc{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px 10px;margin:10px 0;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.calc b{font-weight:600;color:var(--muted)}
.en{display:grid;grid-template-columns:minmax(0,1fr) 64px auto auto;grid-template-areas:"nm ct bs dl" "im im im im" "ms ms ms ms";gap:6px;align-items:center;margin-bottom:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px}
.en [data-ek=name],.en [data-ek=mon]{grid-area:nm;min-width:0}.en [data-ek=count]{grid-area:ct}.en label.bx{grid-area:bs}.en [data-ek=img]{grid-area:im}.en [data-endel]{grid-area:dl;white-space:nowrap;padding:6px 10px}
.en .cnt2{font-size:11.5px;color:var(--muted);grid-area:ms}
.en label.bx{display:flex;gap:3px;align-items:center;font-size:12px;white-space:nowrap}
.jt{display:grid;grid-template-columns:minmax(0,1fr) auto 84px 30px;gap:5px 8px;align-items:center;margin:6px 0 12px;font-size:13px}
.jt .h{font-size:11.5px;color:var(--muted)}
.jt .av{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.jt input{padding:5px 7px}
.jt .on{color:var(--accent);font-weight:700}
.jt .btn{padding:4px 0;font-size:13px;width:30px}
.jt>span:nth-child(4n+1){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.9;cursor:default}
.sec{font-size:12.5px;font-weight:700;margin:12px 0 4px}
.rulebox{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);margin-bottom:10px}
.rulebox b{color:var(--muted);font-weight:600}
.pre{display:flex;gap:6px;align-items:center;margin-bottom:5px;font-size:13px}.pre>span:not(.gl){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;background:var(--soft)}
.tk .row{gap:6px}.tk select{width:auto}.tk .btn{white-space:nowrap}.tk textarea{margin-top:6px;min-height:52px}
.soonbox{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:13px;line-height:1.6}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

footer.status{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
footer.status b{color:var(--ink);font-weight:500}
footer.status .w{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>소재 편집기<small>이세계 모험가 길드 · 소재·음식·장비·물약 정의</small></h1>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools">
      <span class="fstat" id="fstat"></span>
      <button class="btn primary" id="bSave" title="data 폴더의 collegium_data.json에 저장 (Ctrl+S)">저장</button>
      <button class="btn" id="bOpen" title="data 폴더의 collegium_data.json을 불러옴">불러오기</button>
      <button class="btn" id="bDir" title="저장·불러오기할 data 폴더를 고르거나 바꿈">폴더</button>
      <button class="btn" id="bReset">처음 상태로</button>
      <input type="file" id="fLoad" accept=".json,application/json" hidden>
      <span class="saved" id="saved"></span>
      <input type="file" id="fIcon" accept="image/*" hidden>
    </div>
  </header>

  <div class="main">
    <section class="panel" id="left" aria-live="polite"></section>
    <aside class="panel side" id="right"></aside>
  </div>
  <footer class="status" id="status"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dlg" id="dlg" hidden><div class="dlgbox" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT"></h3><div id="dlgB"></div><div class="row" id="dlgA" style="justify-content:flex-end;margin-top:14px"></div></div></div>

<script>
'use strict';
/* ========== 기본 데이터 ========== */
const GRADES = ['F','E','D','C','B','A','S'];
const LINES = [ // 코어 5계열 + 추가용 계열
  {k:'slay',  n:'토벌',      core:true,  sub:'마물 부산물'},
  {k:'hunt',  n:'사냥·채집', core:true,  sub:'동식물'},
  {k:'study', n:'조사',      core:true,  sub:'마력 결정'},
  {k:'guard', n:'호위·구호', core:true,  sub:'사례품'},
  {k:'mine',  n:'탐사',      core:true,  sub:'광석'},
  {k:'food',  n:'식재료',    core:false},
  {k:'restore',n:'복원',     core:false},
  {k:'etc',   n:'기타',      core:false},
];
const CORE = { // 등급 순서 F E D C B A S (docs/data/materials_v0.1.md)
  slay:['짐승 뼛조각','늑대 송곳니','오크 엄니','트롤 뿔','와이번 비늘','키메라 뿔','용의 유해'],
  hunt:['참나무 가지','사슴 가죽','흑곰 가죽','그리폰 깃털','세계수 가지','불사조 깃털','용근'],
  study:['희미한 마석','마석 조각','마정석','고급 마정석','정령석','성좌석','용안석'],
  guard:['무명천','모직 천','마직 천','축복받은 천','은빛 실타래','성은 실타래','용익막'],
  mine:['고철 조각','구리 원석','철광석','흑철광','미스릴 원석','아다만 원석','운철'],
};
const KINDS = [{k:'mat',n:'소재'},{k:'food',n:'음식'},{k:'gear',n:'장비'},{k:'potion',n:'물약'},{k:'mon',n:'몬스터'},{k:'quest',n:'퀘스트'}];
const QCATS = [{k:'req',n:'의뢰'},{k:'main',n:'메인'},{k:'sub',n:'서브'},{k:'promo',n:'승급'},{k:'res',n:'리소스'}];
const ROLES = ['주','부','복원','기타'];
const KIND_PREFIX = {food:'food',gear:'gear',potion:'pot'};
const EFFECT_LABEL = {food:'효과',gear:'설명',potion:'효과'};
// 장비 종류 (docs/data/equipment_v0.1.md). lines = 착용 계열 (능력치 0힘 1민첩 2지력 3정신 4기교), 장신구는 전체
const GTYPES=[
  {k:'sword',n:'검',slot:'weapon',lines:[0]},{k:'bow',n:'활',slot:'weapon',lines:[1]},{k:'staff',n:'지팡이',slot:'weapon',lines:[2]},{k:'mace',n:'성구(메이스)',slot:'weapon',lines:[3]},{k:'dagger',n:'단검',slot:'weapon',lines:[4]},

function durCalc(grade,d,n){
  const R=S.qrule,gi=GRADES.indexOf(grade),bw=BAL.weeks[gi],w=bw+d;
  if(w<1) return null;
  let reward=BAL.reward[gi]*Math.pow(R.rMul,d),capped=false;
  if(R.cap&&d>0&&gi<GRADES.length-1){const lim=BAL.reward[gi+1]/BAL.weeks[gi+1]*w;if(reward>lim){reward=lim;capped=true;}}
  return {w,reward:Math.round(reward),perWeek:Math.round(reward/w),capped,
    mon:n==null?null:Math.max(1,Math.round(n*Math.pow(R.mMul,d))),
    ref:Math.round(BAL.ref[gi]*(1+R.refPct/100*d)*10)/10,
    death:1-Math.pow(1-BAL.death[gi],w/bw)};
}

function questFinal(q){
  const gi=GRADES.indexOf(q.grade),j=q.judge||JDEF(),c=durCalc(q.grade,(q.view||{}).delta||0,null)||durCalc(q.grade,0,null);
  const autoRef=Math.round(c.ref*(j.boss?BAL.bossMult:1)*10)/10, ti=LINES.filter(l=>l.core).findIndex(l=>l.k===q.line);
  const autoStats=ti>=0?[ti]:[], n=BAL.reqCount[gi];
  const auto={ref:autoRef,death:c.death,reward:c.reward,fameS:BAL.fameS[gi],fameF:BAL.fameF[gi],trustS:BAL.trustS,trustF:BAL.trustF};
  const fin={},over=[];for(const k in auto){if(j[k]!=null&&j[k]!==''){fin[k]=+j[k];over.push(k);}else fin[k]=auto[k];}
  let stats,statNote;
  if(j.smode==='manual'&&j.stats.length){stats=j.stats.slice();statNote='직접 지정';over.push('stats');}
  else{stats=autoStats;statNote=`등급 기본 ${n}개: ${ti>=0?STATS[ti]+' + ':''}무작위 ${n-autoStats.length}개`;}
  return {auto,fin,over,stats,statNote,n,weeks:c.w,capped:c.capped,ti};
}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function dbGet(){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction(STORE).objectStore(STORE).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null;}}

// 식사 효과 글 해석 (게임 game_core.js DISH_FX와 같은 규칙)
const FX_STATS=['힘','민첩','지력','정신','기교'];
function parseFx(t){t=t||'';const m=t.match(/\+\s*(\d+(?:\.\d+)?)%/);if(!m)return null;const head=t.slice(0,m.index);
  const st=head.includes('모든 능력치')?FX_STATS.slice():FX_STATS.filter(k=>head.includes(k));return {stats:st,pct:+m[1]/100};}
function fxPreview(t){if(!(t||'').trim())return `<div class="msg bad">효과가 비어 있습니다. 비워 두면 meals.csv 효과를 씁니다.</div>`;
  const f=parseFx(t);if(!f&&/\d\s*%/.test(t))return `<div class="msg" style="color:var(--warn)">능력치 효과 없음 → 발견 수 보너스(요리당 +2%)만 적용</div>`;if(!f)return `<div class="msg bad">해석할 수 없습니다. “능력치 +n%” 꼴로 적어 주세요 (예: 힘·기교 +3%).</div>`;
  if(!f.stats.length)return `<div class="msg" style="color:var(--warn)">능력치 없음 → 발견 수 보너스(요리당 +2%)만 적용</div>`;
  return `<div class="msg ok">게임 적용: ${f.stats.join('·')} ×${(1+f.pct).toFixed(2).replace(/0$/,'')} (먹은 사람만)</div>`;}
const recipeKey=i=>i.recipe.map(r=>r.m).filter(Boolean).sort().join('+');

const SORTS=[{k:'added',n:'추가한 순'},{k:'name',n:'이름'},{k:'grade',n:'등급'},{k:'line',n:'계열'},{k:'used',n:'쓰이는 곳 수'}];
function sortedExtras(){
  const L=LINES.map(l=>l.k), d=xsort.dir, ex=S.mats.filter(m=>!m.core).map((m,i)=>({m,i}));
  const cmp={added:(a,b)=>a.i-b.i,
    name:(a,b)=>a.m.name.localeCompare(b.m.name,'ko'),
    grade:(a,b)=>GRADES.indexOf(a.m.grade)-GRADES.indexOf(b.m.grade),
    line:(a,b)=>L.indexOf(a.m.line)-L.indexOf(b.m.line),
    used:(a,b)=>(usedBy(a.m.id).length+gotFrom(a.m.id).length)-(usedBy(b.m.id).length+gotFrom(b.m.id).length)}[xsort.key]||((a,b)=>a.i-b.i);
  // 같은 값이면 등급 → 이름 순으로 안정 정렬
  return ex.sort((a,b)=>d*cmp(a,b)||GRADES.indexOf(a.m.grade)-GRADES.indexOf(b.m.grade)||a.m.name.localeCompare(b.m.name,'ko')||a.i-b.i).map(x=>x.m);
}

  for(const g of GRADES){

const catName=k=>(QCATS.find(c=>c.k===k)||{n:k}).n;
const mainMat=q=>{const r=q.rewards.find(x=>x.role==='주')||q.rewards[0];return r&&mat(r.m);};
function rwBlock(q){

  return `<span class="mini rwi" title="${esc(tip)}">${q.rewards.map(r=>{const m=mat(r.m);return `<span class="rwc ${r.role==='주'?'main':''}">${m?iconHtml(m):'<span class="ico" data-g="F">?</span>'}<em>${r.p}</em></span>`;}).join('')}</span>`;
}
// 게시판 후보 = 기본 의뢰 + 칸에 추가한 퀘스트(분류 리소스, 유형 있음). 게임은 같은 칸 중 하나를 무작위로 게시
const isCellQ=q=>!q.core&&q.cat==='res'&&!!q.line&&LINES.some(l=>l.core&&l.k===q.line);
const isBoard=q=>q.core||isCellQ(q);
const cellQs=(line,g)=>S.quests.filter(x=>isBoard(x)&&x.line===line&&x.grade===g).sort((a,b)=>(b.core?1:0)-(a.core?1:0));
const mainMatId=q=>(q.rewards.find(r=>r.role==='주')||{}).m||'';
// (폐지 2026-11-03) 같은 칸 주 소재 일치 경고. 칸의 퀘스트들이 서로의 주 소재를 부 소재로 주는 구조로 바뀌어 쓰지 않음
const mainMismatch=q=>''; // 경고를 되살리려면 같은 칸 기본 의뢰와 주 소재(mainMatId)를 비교
// 게시판 퀘스트 중 한 곳에서만 나오는 부 소재 (주 소재로는 어디서도 안 나옴, 식재료 제외)
function singleSourceMats(){const cnt={},main=new Set();S.quests.filter(isBoard).forEach(q=>q.rewards.forEach(r=>{if(!r.m)return;if(r.role==='주')main.add(r.m);else cnt[r.m]=(cnt[r.m]||[]).concat(q.id);}));
  return Object.entries(cnt).filter(([m,ids])=>ids.length===1&&!main.has(m)&&(mat(m)||{}).line!=='food').map(([m,ids])=>({m,q:ids[0]}));} // 식재료는 한 번 얻으면 요리가 영구 해금되므로 제외
function qMini(q){const mm=mainMismatch(q),ss=singleSourceMats().filter(x=>x.q===q.id).length;
  return `<button class="cell qcell" data-pick="${q.id}" aria-pressed="${sel.quest===q.id}"><span class="nm">${esc(q.name)}${q.core?'':' <span class="badge">추가</span>'}</span>${rwBlock(q)}${mm?'<span class="incomplete">주 소재가 기본과 다름</span>':''}${ss?`<span class="incomplete">공급처 1곳 부 소재 ${ss}</span>`:''}</button>`;}
function qCell(q){return `<button class="cell qcell" data-pick="${q.id}" aria-pressed="${sel.quest===q.id}"><span class="nm">${esc(q.name)}</span>${rwBlock(q)}</button>`;}

  return h;
}

function loadIcon(file){
  if(!file||!/^image\//.test(file.type)){toast('이미지 파일을 올려 주세요');return;}
  const o=cur();if(!o)return;
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    const MAX=512, sc=Math.min(1,MAX/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);

  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast('이미지를 읽지 못했습니다');};
  im.src=url;
}

function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}return rows;}
const BAL_KEYS={'gear.weaponPrice':'wprice','quest.reward':'reward','quest.weeks':'weeks','quest.ref':'ref','quest.deathBase':'death','quest.reqCount':'reqCount','quest.bossMult':'bossMult','fame.succ':'fameS','fame.fail':'fameF'};

async function writeBalanceReward(dir,arr){
  const fh=await fileIn(dir,'balance.csv');if(!fh)throw new Error(`${dir.name} 폴더에 balance.csv가 없습니다`);
  const raw=new Uint8Array(await (await fh.getFile()).arrayBuffer()),bom=raw[0]===0xEF&&raw[1]===0xBB&&raw[2]===0xBF; // 엑셀용 BOM 유지
  const text=new TextDecoder().decode(bom?raw.subarray(3):raw);let hit=0;
  const out=(bom?'\uFEFF':'')+text.replace(/^(quest,reward,)([^,\r\n]*)/m,(m0,a)=>{hit++;return a+arr.join('|');});
  if(!hit)throw new Error('balance.csv에서 quest,reward 줄을 찾지 못했습니다');
  await writeFile(dir,'balance.csv',new TextEncoder().encode(out));
}
async function readBalance(dir,quiet){

    const miss=Object.values(BAL_KEYS).filter(k=>!(k in got));

async function openFromDir(pick){
  if(!window.showDirectoryPicker){$('fLoad').click();return;}
  const dir=await ensureDir(pick,()=>openFromDir(false));if(!dir)return;
  let fh=await fileIn(dir,DATA_FILE),old=false;if(!fh){fh=await fileIn(dir,'backup.json');old=!!fh;}
  if(!fh){showDlg('불러올 파일이 없습니다',`<p style="font-size:13px;margin:0"><b>${esc(dir.name)}</b> 폴더에 ${DATA_FILE}이(가) 없습니다.<br>처음이라면 <b>저장</b>을 눌러 지금 작업으로 파일을 만드세요.</p>`,[{t:'다른 폴더 고르기',fn:()=>openFromDir(true)},{t:'파일 하나 고르기',fn:()=>$('fLoad').click()},{t:'닫기',primary:true}]);return;}
  try{const d=JSON.parse(await (await fh.getFile()).text()),next=fromFile(d);
    confirmLoad(next,{name:`${dir.name}/${fh.name}`,savedAt:d.savedAt,old},async()=>{
      let miss=0;for(const o of [...next.mats,...next.items])if(!o.icon&&o.iconRef){try{const parts=o.iconRef.split('/');let dd=dir;for(let k=0;k<parts.length-1;k++)dd=await dd.getDirectoryHandle(parts[k]);
        const file=await (await dd.getFileHandle(parts[parts.length-1])).getFile();o.icon=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});delete o.iconRef;}catch(e){miss++;}}
      applyLoaded(next);if(miss)toast(`불러왔습니다 · 찾지 못한 아이콘 ${miss}개`);});}
  catch(e){toast('불러오지 못했습니다: '+e.message);}
}
function applyLoaded(next){S=next;migrateQuests();sel={mat:null,food:null,gear:null,potion:null,mon:null,quest:null};confirming=null;save(true);setMeta({dirty:false,lastOpened:Date.now()});render();toast('불러왔습니다');}
function showDlg(title,html,actions){$('dlgT').textContent=title;$('dlgB').innerHTML=html;const A=$('dlgA');A.innerHTML='';
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn'+(a.primary?' primary':'');b.textContent=a.t;b.onclick=()=>{$('dlg').hidden=true;if(a.fn)a.fn();};A.appendChild(b);});
  $('dlg').hidden=false;(A.querySelector('.primary')||A.lastChild).focus();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden){$('dlg').hidden=true;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile();}});
window.addEventListener('beforeunload',e=>{if(meta.dirty){e.preventDefault();e.returnValue='';}});
function dataUrlBytes(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

/* ========== 이벤트 ========== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-pick]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;confirming=null;render();return;}
  if(t.dataset.addcell){const [line,g]=t.dataset.addcell.split('|'),base=S.quests.find(x=>x.core&&x.line===line&&x.grade===g),n=cellQs(line,g).length+1;
    let k=n,id;do{id=`q_${line}_${g}_${k++}`;}while(quest(id));
    const q=JSON.parse(JSON.stringify(base||{}));Object.assign(q,{id,name:`${lineName(line)} ${g}급 의뢰 ${n}`,cat:'res',grade:g,line,core:false,client:'',notice:'',desc:'',tip:'',judge:JDEF()});
    if(q.view)q.view.enemies=[];if(!q.rewards)q.rewards=[];S.quests.push(q);migrateQuests();sel.quest=id;qsub='basic';confirming=null;save();render();const el=$('fName');if(el)el.select();toast('기본 의뢰를 복사해 만들었습니다 (보상 소재 포함). 부 소재를 바꿔 개성을 주세요');return;}
  if(t.dataset.endel!==undefined){const q=cur();if(q){q.view.enemies.splice(+t.dataset.endel,1);save();render();}return;}
  if(t.id==='addEn'){const q=cur();if(q&&q.view.enemies.length<3){q.view.enemies.push({mon:'',count:1,boss:false});save();render();const el=document.querySelector(`[data-en="${q.view.enemies.length-1}"][data-ek="mon"]`);if(el)el.focus();}return;}
  if(t.dataset.predel!==undefined){const q=cur();if(q){q.cond.prereq.splice(+t.dataset.predel,1);save();render();}return;}
  if(t.dataset.prejump){sel.quest=t.dataset.prejump;confirming=null;render();return;}
  if(t.dataset.tsauto){const q=cur();if(q){q.talk[t.dataset.tsauto].scene=`quest_${q.id}_${t.dataset.tsauto}`;save();render();}return;}
  if(t.dataset.jauto){const q=cur();if(q){q.judge[t.dataset.jauto]=null;save();render();}return;}
  if(t.dataset.jstat!==undefined){const q=cur();if(q){const k=+t.dataset.jstat,a=q.judge.stats,ix=a.indexOf(k);if(ix>=0)a.splice(ix,1);else a.push(k);a.sort();save();render();}return;}
  if(t.id==='addMon'){S.seq.mon=(S.seq.mon||0)+1;const m=Object.assign({id:'mon_'+String(S.seq.mon).padStart(2,'0'),name:'새 몬스터',grade:'F',kind:'마물',img:'',scale:100,drops:[],desc:'',tip:''},monBase('F'));S.mons.push(m);sel.mon=m.id;confirming=null;save();render();$('fName').select();return;}
  if(t.id==='mBase'){const m=cur();if(m){Object.assign(m,monBase(m.grade));save();render();}return;}
  if(t.id==='delMon'){confirming=(cur()||{}).id;render();return;}
  if(t.id==='enhReset'){S.enh=ENH_DEF.slice();save();render();return;}
  if(t.id==='gDef'){const o=cur();if(o&&o.gtype){Object.assign(o,gearDefaults(o.gtype,o.grade),{effect:o.effect});save();render();toast(`${o.grade}급 기본값으로 채웠습니다`);}return;}
  if(t.id==='brwUndo'){setMeta({balEdit:null});BAL.reward=fileReward().slice();save();render();toast('기본 보상을 balance.csv 값으로 되돌렸습니다');return;}
  if(t.id==='balRe'){(async()=>{const d=await ensureDir(false);if(d)await readBalance(d,false);})();return;}
  if(t.id==='ruleReset'){S.qrule=Object.assign({},RULE_DEF);save();render();toast('계수를 기본값으로 되돌렸습니다');return;}
  if(t.dataset.qsub){qsub=t.dataset.qsub;try{localStorage.setItem('mat_qsub',qsub);}catch(e){}render();return;}
  if(t.dataset.pick){sel[tab]=t.dataset.pick;confirming=null;render();return;}
  if(t.dataset.rwdel!==undefined){const q=cur();if(q){q.rewards.splice(+t.dataset.rwdel,1);save();render();}return;}
  if(t.dataset.jumpq){tab='quest';sel.quest=t.dataset.jumpq;confirming=null;render();return;}
  if(t.dataset.jump){const i=S.items.find(x=>x.id===t.dataset.jump);if(i){tab=i.kind;sel[tab]=i.id;confirming=null;render();}return;}
  switch(t.id){
    case 'qvIcon':case 'qvText':qview=t.id==='qvText'?'text':'icon';try{localStorage.setItem('mat_qview',qview);}catch(e){}render();break;
    case 'sortDir':setSort(xsort.key,-xsort.dir);break;
    case 'addMat':{const n=nextId('mat'),m={id:'mat_x'+String(n).padStart(3,'0'),name:'새 소재',grade:'F',line:'etc',core:false,desc:'',icon:null};S.mats.push(m);sel.mat=m.id;save();render();$('fName').select();break;}
    case 'addItem':{const p=KIND_PREFIX[tab],n=nextId(tab),i={id:`${p}_${String(n).padStart(2,'0')}`,kind:tab,name:'새 '+KINDS.find(k=>k.k===tab).n,grade:'F',desc:'',tip:'',recipe:[],icon:null};if(tab==='gear')Object.assign(i,{gtype:'',stats:{},atk:0,def:0,mdef:0,hp:0,mp:0,luck:0,price:0,effect:''});S.items.push(i);sel[tab]=i.id;save();render();$('fName').select();break;}
    case 'addQuest':{const n=nextId('quest'),q={id:'q_x'+String(n).padStart(3,'0'),name:'새 퀘스트',cat:'sub',grade:'F',line:'',core:false,client:'',notice:'',desc:'',tip:'',rewards:[],view:{region:'',delta:0,enemies:[]},judge:JDEF(),cond:CDEF(),talk:Object.fromEntries(TALKS.map(t=>[t.k,TDEF()]))};S.quests.push(q);sel.quest=q.id;qsub='basic';save();render();$('fName').select();break;}
    case 'addRw':{const q=cur();if(q){q.rewards.push({m:'',role:q.rewards.length?'부':'주',p:q.rewards.length?10:100});save();render();}break;}
    case 'delQuest':confirming=(cur()||{}).id;render();break;
    case 'upIcon':$('fIcon').click();break;
    case 'clrIcon':{const o=cur();if(o){o.icon=null;save();render();}break;}
    case 'delMat':case 'delItem':confirming=(cur()||{}).id;render();break;
    case 'delNo':confirming=null;render();break;
    case 'delYes':{if(tab==='mon'){S.mons=S.mons.filter(m=>m.id!==sel.mon);sel.mon=null;}else if(tab==='mat'){S.mats=S.mats.filter(m=>m.id!==sel.mat);sel.mat=null;}else if(tab==='quest'){S.quests=S.quests.filter(q=>q.id!==sel.quest);sel.quest=null;}else{S.items=S.items.filter(i=>i.id!==sel[tab]);sel[tab]=null;}confirming=null;save();render();toast('삭제했습니다');break;}
    case 'bSave':saveFile();break;
    case 'bOpen':openFromDir(false);break;
    case 'bDir':ensureDir(true);break;
    case 'bReset':
      if(t.dataset.arm){S=seed();migrateQuests();sel={mat:null,food:null,gear:null,potion:null,mon:null,quest:null};t.dataset.arm='';t.textContent='처음 상태로';save();render();toast('처음 상태로 되돌렸습니다');}
      else{t.dataset.arm='1';t.textContent='정말 되돌리기 (한 번 더)';setTimeout(()=>{t.dataset.arm='';t.textContent='처음 상태로';},3500);}
      break;
  }
});
document.addEventListener('input',e=>{
  const t0=e.target;
  if(['rMul','mMul','refPct','dMin','dMax'].includes(t0.id)){const v=parseFloat(t0.value);if(!isFinite(v))return;const lim={rMul:[1,5],mMul:[1,5],refPct:[0,50],dMin:[-5,0],dMax:[0,8]}[t0.id];
    S.qrule[t0.id]=Math.max(lim[0],Math.min(lim[1],t0.id[0]==='d'?Math.round(v):v));save();rerenderKeepFocus();return;}
  const o=cur();if(!o)return;const t=e.target;
  if(t.dataset.en!==undefined){const en=o.view.enemies[+t.dataset.en];if(!en)return;const k=t.dataset.ek;
    if(k==='count'){en.count=Math.max(1,Math.min(99,parseInt(t.value)||1));}else if(k==='name'||k==='img')en[k]=t.value;
    save();if(k==='count'){const c=document.querySelector(`[data-encnt="${t.dataset.en}"]`);if(c){const n=en.boss?en.count:durCalc(o.grade,o.view.delta,en.count).mon;c.textContent=`이 기간에는 ${n}마리${en.boss?' · 보스는 수 늘지 않음':''}`;}}return;}
  if(t.id==='fName'){o.name=t.value;save();renderTabs();renderStatus();const el=document.querySelector(`[data-pick="${o.id}"]`);if(el){const nm=el.querySelector('.nm,b');if(nm)nm.textContent=o.name;}}
  else if(t.id==='fDesc'){o.desc=t.value;save();const fp=$('fxPrev');if(fp)fp.innerHTML=fxPreview(t.value);}
  else if(t.id==='fTip'){o.tip=t.value;save();}
  else if(t.id==='fClient'){o.client=t.value;save();}
  else if(t.id==='gEffect'){o.effect=t.value;save();}
  else if(t.id==='mImg'){o.img=t.value;save();}
  else if(t.id==='cRumor'){o.cond.rumor=t.value;save();}
  else if(t.id==='cNear'){o.cond.near=t.value;save();}
  else if(t.dataset.ttext){o.talk[t.dataset.ttext].text=t.value;save();}
  else if(t.dataset.tscene){o.talk[t.dataset.tscene].scene=t.value;save();}
  else if(t.id==='fNotice'){o.notice=t.value;save();const c=$('noticeCnt');if(c)c.textContent=[...t.value].length+'자';}
  else if(t.dataset.rwp!==undefined){const r=o.rewards[+t.dataset.rwp];if(r){r.p=Math.max(0,Math.min(100,parseFloat(t.value)||0));save();}}
  else if(t.dataset.qty!==undefined){const r=o.recipe[+t.dataset.qty];if(r){r.n=Math.max(1,Math.min(99,parseInt(t.value)||1));save();renderStatus();}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sortKey'){setSort(t.value,xsort.dir);return;}
  if(t.id==='capOn'){S.qrule.cap=t.checked;save();render();return;}
  if(t.dataset.mst){const o2=cur();if(o2){o2[t.dataset.mst]=Math.max(0,Math.round(+t.value||0));save();render();}return;}
  if(t.dataset.mdrop!==undefined){const o2=cur();if(o2){const i2=+t.dataset.mdrop;o2.drops[i2]=t.value;o2.drops=o2.drops.filter(Boolean);save();render();}return;}
  if(t.id==='mKind'){const o2=cur();if(o2){o2.kind=t.value;save();render();}return;}
  if(t.dataset.enh!==undefined){const v=Math.round(parseFloat(t.value));if(isFinite(v)&&v>=0){S.enh[+t.dataset.enh]=v;save();}render();return;}
  if(t.dataset.brw!==undefined){const gi=+t.dataset.brw,v=Math.round(parseFloat(t.value));if(!isFinite(v)||v<1){render();toast('기본 보상은 1 이상의 숫자여야 합니다');return;}
    const arr=BAL.reward.slice();arr[gi]=v;const same=arr.every((x,i)=>x===fileReward()[i]);setMeta({balEdit:same?null:{reward:arr}});BAL.reward=arr;save();render();return;}
  if(t.id==='simMetric'){simMetric=t.value;try{localStorage.setItem('mat_sim',simMetric);}catch(x){}render();return;}
  if(t.id==='fIcon'){loadIcon(t.files[0]);t.value='';return;}
  if(t.id==='fLoad'){const f=t.files[0];t.value='';if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x),next=fromFile(d);confirmLoad(next,{name:f.name,savedAt:d.savedAt,old:!!d.mats,noIcons:!d.mats},()=>applyLoaded(next));}catch(err){toast('불러오지 못했습니다: '+err.message);}});return;}
  const o=cur();if(!o)return;
  if(t.id==='fGrade'){o.grade=t.value;save();render();}
  else if(t.id==='fLine'){o.line=t.value;save();render();}
  else if(t.id==='fCat'){o.cat=t.value;save();render();}
  else if(t.id==='fType'){o.line=t.value;save();render();}
  else if(t.id==='cRoute'){o.cond.route=t.value;save();}
  else if(t.id==='cGrade'){o.cond.minGrade=t.value;save();}
  else if(t.id==='cFame'||t.id==='cTrust'){const v=t.value.trim();o.cond[t.id==='cFame'?'fame':'trust']=v===''||!isFinite(+v)?null:Math.max(0,+v);save();render();}
  else if(t.id==='cReappear'){o.cond.reappear=Math.max(1,Math.min(96,parseInt(t.value)||8));save();}
  else if(t.id==='cHidden'){o.cond.hidden=t.checked;save();render();}
  else if(t.id==='cPreAdd'){if(t.value&&!o.cond.prereq.includes(t.value))o.cond.prereq.push(t.value);save();render();}
  else if(t.dataset.tmode){o.talk[t.dataset.tmode].mode=t.value;save();render();}
  else if(t.dataset.tface){o.talk[t.dataset.tface].face=t.value;save();}
  else if(t.id==='jSmode'){o.judge.smode=t.value;if(t.value==='manual'&&!o.judge.stats.length){const F=questFinal(o);o.judge.stats=F.ti>=0?[F.ti]:[];}save();render();}
  else if(t.id==='jBoss'){o.judge.boss=t.checked;save();render();}
  else if(t.dataset.jk){const k=t.dataset.jk,v=t.value.trim();if(v===''||!isFinite(+v))o.judge[k]=null;else{let x=Math.max(0,+v);if(k==='death')x=Math.min(100,x)/100;o.judge[k]=x;}save();render();}
  else if(t.id==='gType'){const was=o.gtype;o.gtype=t.value;if(t.value&&(!was||!Object.values(o.stats||{}).some(Boolean)))Object.assign(o,gearDefaults(t.value,o.grade),{effect:o.effect});save();render();}
  else if(t.id==='gPrice'){o.price=Math.max(0,Math.round(+t.value||0));save();render();}
  else if(t.dataset.gst!==undefined){const v=Math.max(0,Math.round(+t.value||0));o.stats=o.stats||{};if(v)o.stats[t.dataset.gst]=v;else delete o.stats[t.dataset.gst];save();render();}
  else if(t.dataset.gcb){o[t.dataset.gcb]=Math.max(0,Math.round(+t.value||0));save();render();}
  else if(t.id==='vRegion'){o.view.region=t.value;save();render();}
  else if(t.id==='vDelta'){o.view.delta=parseInt(t.value)||0;save();render();}
  else if(t.dataset.en!==undefined&&t.dataset.ek==='mon'){const en=o.view.enemies[+t.dataset.en];if(en){en.mon=t.value;save();render();}}
  else if(t.dataset.en!==undefined&&t.dataset.ek==='boss'){const en=o.view.enemies[+t.dataset.en];if(en){en.boss=t.checked;save();render();}}
  else if(t.dataset.rwm!==undefined){o.rewards[+t.dataset.rwm].m=t.value;save();render();}
  else if(t.dataset.rwr!==undefined){o.rewards[+t.dataset.rwr].role=t.value;save();}
  else if(t.dataset.slot!==undefined){
    const s=+t.dataset.slot;
    if(t.value){if(o.recipe[s])o.recipe[s].m=t.value;else{while(o.recipe.length<s)o.recipe.push({m:'',n:1});o.recipe[s]={m:t.value,n:1};}}
    else{o.recipe.splice(s,1);}
    save();render();
  }
});
document.addEventListener('toggle',e=>{if(e.target.id==='enhBox'){enhOpen=e.target.open;try{localStorage.setItem('mat_enh',enhOpen?'1':'0');}catch(x){}}if(e.target.id==='rulesBox'){rulesOpen=e.target.open;try{localStorage.setItem('mat_rules',rulesOpen?'1':'0');}catch(x){}}},true);
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');loadIcon(e.dataTransfer.files[0]);}});
document.addEventListener('click',e=>{if(e.target.closest('#drop'))$('fIcon').click();});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='drop'){e.preventDefault();$('fIcon').click();}});

(async()=>{
  const saved=await dbGet();
  S=saved&&saved.mats&&saved.items?saved:seed();
  // 이전 저장본에 코어 소재가 빠져 있으면 보충
  const have=new Set(S.mats.map(m=>m.id));
  seed().mats.filter(m=>m.core&&!have.has(m.id)).forEach(m=>S.mats.push(m));
  if(!S.quests){S.quests=seedQuests(S.mats);S.seq.q=S.seq.q||0;}
  migrateQuests();
  const m=await dbGetK('meta');if(m)meta=Object.assign(meta,m);applyBal(meta.bal?meta.bal.v:{});dirHandle=await dbGetK('dir')||null;if(!dirHandle)meta.dirName='';renderFstat();
  if(dirHandle){try{if(await dirHandle.queryPermission({mode:'readwrite'})==='granted'){balRead=true;readBalance(dirHandle,true);}}catch(e){}}
  sel.mat='mat_slay_F';
  render();
})();
</script>
