<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬 칸 간격 조절</title>
<style>
:root{--ink:#3b2a1e;--muted:#8a735a;--paper:#fffaf0;--line:rgba(120,82,44,.28);--line2:rgba(120,82,44,.5);--wood:#5a3a22;--wood2:#7a5032;--gold:#c9963e}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif KR","Nanum Myeongjo",serif;color:var(--ink);background:#2b2118}
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
.ctl{background:#f3e6c8;padding:18px 18px 40px;border-right:3px solid var(--wood2);overflow:auto;max-height:100vh}
.ctl h1{font-size:19px;margin:0 0 4px;color:var(--wood)} .ctl p.d{font-size:13px;color:var(--muted);margin:0 0 14px}
.ctl h2{font-size:14px;margin:18px 0 8px;color:var(--wood);border-bottom:1px dashed var(--line2);padding-bottom:4px}
.r{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.r input[type=range]{width:100%} .r output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.r.ck{grid-template-columns:96px 1fr}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:600 14px inherit;font-family:inherit;color:var(--wood);background:linear-gradient(#fffaf0,#efe0c0);border:2px solid var(--line2);border-radius:9px;padding:6px 12px;cursor:pointer}
textarea{width:100%;height:210px;white-space:pre;overflow:auto;margin-top:8px;font:12px/1.45 ui-monospace,Consolas,monospace;background:#fffaf0;border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--ink)}
.stage{padding:28px;overflow:auto}
.paper{background:radial-gradient(circle at 30% 20%,#fff8ea,#f5e6c6);border-radius:18px;border:4px solid #c9a46a;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:22px 26px;max-width:880px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 8px}
.tabs{display:flex;gap:6px;border-bottom:3px solid var(--wood2);padding:0 4px;margin-bottom:12px}
.tabs span{font:600 15px inherit;color:var(--wood);background:linear-gradient(#f8ecd2,#ead6ae);border:2px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;padding:5px 14px 4px;position:relative;top:3px}
.tabs span.on{background:linear-gradient(#7a5032,#5a3a22);color:#fff3d6}
.h{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:19px;font-weight:700;color:var(--wood)}
.h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line2),transparent)} .h small{font-size:14px;font-weight:400;color:var(--muted)}
/* ---- 조절 대상 (변수로 연결) ---- */
.skrow{display:flex;gap:var(--gap);margin-top:var(--rowtop)}
.sk{display:flex;flex-direction:column;align-items:center;gap:var(--lgap);width:var(--colw)}
.sk em{font-style:normal;font-size:var(--fs);color:var(--wood);text-align:center;line-height:1.2;word-break:keep-all}
.sk.empty em{color:#b3a284}
.slot{position:relative;width:var(--slot);height:var(--slot);border-radius:var(--rad);background:radial-gradient(circle at 50% 40%,#fffaf0,#efdfbd);border:var(--bw) solid #c9963e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 0 rgba(90,58,34,.18),0 4px 10px rgba(60,36,16,.10);display:grid;place-items:center;flex:none}
.slot img{width:var(--icon);height:var(--icon);object-fit:contain;filter:drop-shadow(0 2px 1px rgba(60,36,16,.25))}
.slot.empty{background:repeating-linear-gradient(45deg,#f3e8d2 0 8px,#ece0c6 8px 16px);border-style:dashed;border-color:var(--line2)}
.lc .slot[data-line="0"]{border-color:#c0583e;box-shadow:inset 0 0 0 2px rgba(192,88,62,.25)}
.lc .slot[data-line="1"]{border-color:#5d9a45;box-shadow:inset 0 0 0 2px rgba(93,154,69,.25)}
.lc .slot[data-line="2"]{border-color:#4f78b8;box-shadow:inset 0 0 0 2px rgba(79,120,184,.25)}
.lc .slot[data-line="3"]{border-color:#d1a23a;box-shadow:inset 0 0 0 2px rgba(209,162,58,.25)}
.lc .slot[data-line="4"]{border-color:#8a5bb5;box-shadow:inset 0 0 0 2px rgba(138,91,181,.25)}
.tip{margin-top:22px;width:320px;background:#fffaf0;border:2px solid var(--wood2);border-radius:12px;padding:12px 14px;box-shadow:0 6px 18px rgba(60,36,16,.25)}
.tip .t1{display:flex;align-items:center;gap:10px}
.tip .t1 .slot{--slot:var(--tiph);--rad:9px;--bw:2px} .tip .t1 b{font-size:17px}
.tip .sec{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.tip .ev{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px}
.tip .ev img{width:var(--evi);height:var(--evi)}
.all{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.pick select{width:100%;font:12px inherit;font-family:inherit;padding:3px;border-radius:6px;border:1px solid var(--line2);background:#fffaf0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.ctl{max-height:none;border-right:0;border-bottom:3px solid var(--wood2)}.stage{padding:16px}}
</style></head><body>
<div class="wrap">
  <div class="ctl">
    <h1>스킬 칸 간격 조절</h1>
    <p class="d">모험가 팝업 → 스킬 탭. 값을 바꾸면 오른쪽이 실제 크기(1:1)로 바뀝니다. 다 맞추면 아래 CSS를 복사해 전달해 주세요.</p>
    <h2>칸</h2>
    <div id="g1"></div>
    <h2>이름</h2>
    <div id="g2"></div>
    <h2>오버 창 아이콘</h2>
    <div id="g3"></div>
    <h2>보기</h2>
    <div class="r ck"><span>계열 색 테두리</span><label><input type="checkbox" id="lc" checked> 켜기</label></div>
    <div class="r"><span>채운 칸 수</span><input type="range" id="fill" min="0" max="5" step="1" value="2"><output id="fillO">2</output></div>
    <div class="pick" id="pick"></div>
    <div class="btns"><button id="reset">지금 게임 값으로</button><button id="copy">CSS 복사</button></div>
    <textarea id="css" readonly></textarea>
    <p class="note">초기값 = 지금 게임(ui_kit.css)에 들어간 값입니다.</p>
  </div>
  <div class="stage">
    <div class="paper" id="paper">
      <div class="tabs"><span class="on">스킬</span><span>전직</span><span>성향</span><span>경력</span></div>
      <div class="h">장착 스킬 <small id="cnt">2 / 5</small></div>
      <div class="skrow" id="row"></div>
      <div class="tip" id="tip"></div>
      <div class="h" style="margin-top:26px">아이콘 30종 확인 <small>지금 칸 크기로</small></div>
      <div class="all" id="all"></div>
    </div>
  </div>
</div>

];

let picks = [12, 18, 0, 6, 24];
const $ = id => document.getElementById(id);
for (const [g, k, n, mn, mx, st, u] of SPEC) {
  const d = document.createElement('div'); d.className = 'r';
  d.innerHTML = `<span>${n}</span><input type="range" min="${mn}" max="${mx}" step="${st}" data-k="${k}"><output data-o="${k}"></output>`;
  $(g).appendChild(d);
}
document.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', () => { V[i.dataset.k] = +i.value; apply(); }));

$('fill').addEventListener('input', () => { $('fillO').textContent = $('fill').value; draw(); });
$('lc').addEventListener('change', () => $('paper').classList.toggle('lc', $('lc').checked));

function draw() {
  const n = +$('fill').value; let h = '';
  for (let i = 0; i < 5; i++) {
    if (i >= n) { h += '<span class="sk empty"><span class="slot empty"></span><em>빈 칸</em></span>'; continue; }
    const c = ICONS[picks[i]]; h += `<span class="sk"><span class="slot" data-line="${c.line}"><img src="${c.src}" alt=""></span><em>${c.name}</em></span>`;
  }
  $('row').innerHTML = h; $('cnt').textContent = n + ' / 5';
  const c = ICONS[picks[0]], e1 = ICONS[(Math.floor(picks[0] / 6)) * 6 + 3], e2 = ICONS[(Math.floor(picks[0] / 6)) * 6 + 1];
  $('tip').innerHTML = `<div class="t1"><span class="slot" data-line="${c.line}"><img src="${c.src}" alt=""></span><div><b>${c.name}</b><div style="font-size:13px;color:var(--muted)">오버 창 미리보기</div></div></div>
    <div class="sec">진화</div><div class="ev"><img src="${e1.src}" alt="">직업 → <b>${e1.name}</b></div><div class="ev"><img src="${e2.src}" alt="">직업 → <b>${e2.name}</b></div>`;
  $('all').innerHTML = ICONS.map(c => `<span class="slot" data-line="${c.line}" title="${c.name}"><img src="${c.src}" alt=""></span>`).join('');
}
function apply() {
  const r = document.documentElement.style;
  for (const k in V) r.setProperty('--' + k, k === 'icon' ? V[k] + '%' : V[k] + 'px');
  document.querySelectorAll('input[data-k]').forEach(i => { i.value = V[i.dataset.k]; });
  document.querySelectorAll('output[data-o]').forEach(o => { const s = SPEC.find(x => x[1] === o.dataset.o); o.textContent = V[o.dataset.o] + s[6]; });

`/* 스킬 탭 칸 (ui_kit.css) */
.skrow{display:flex;gap:${V.gap}px;margin-top:${V.rowtop}px}
.sk{display:flex;flex-direction:column;align-items:center;gap:${V.lgap}px;width:${V.colw}px}
.sk em{font-style:normal;font-size:${V.fs}px;color:var(--ux-wood);text-align:center;line-height:1.2;word-break:keep-all}
.ux-slot.skslot{width:${V.slot}px;height:${V.slot}px;border-width:${V.bw}px;border-radius:${V.rad}px}
.ux-slot.skslot img{width:${V.icon}%;height:${V.icon}%}
/* 오버 창 */
.avtip.sktip .t1 .skslot{width:${V.tiph}px;height:${V.tiph}px}
.avtip .ev img{width:${V.evi}px;height:${V.evi}px}`;
}
