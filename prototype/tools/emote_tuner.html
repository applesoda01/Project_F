<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감정 아이콘 조절</title>
<!-- 2026-11-18: 감정 아이콘(얼굴 말풍선 + 표정 + 기호) 위치 · 크기 조절 도구 (사용자 요청 "이모티콘 위치 조절할 수 있는 툴").
     그림: ../assets/emote/ (GPT 생성 부품 — 사용자가 만들어 줌). 원본 8종은 ref_*.jpg 로 겹쳐 볼 수 있음.
     좌표 단위: 얼굴 가로 = 1 (x · y · w 모두 얼굴 가로 대비). 결과는 「JSON 복사」 또는 「파일 저장」 → Claude 에게 붙여 주면 게임에 반영 -->
<style>
:root{--ink:#3b2a1e;--muted:#8a735a;--paper:#fffaf0;--line:rgba(120,82,44,.28);--wood:#5a3a22;--bg:#efe2c4;--acc:#c9963e;--sel:#d0542c}
@media (prefers-color-scheme: dark){:root{--ink:#f0e4cf;--muted:#b8a184;--paper:#2b241c;--line:rgba(230,200,160,.2);--wood:#3a2616;--bg:#1d1813;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--wood);color:#f6e7c8;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top h1{font-size:17px;margin:0 6px 0 0}
button,select{font:inherit;font-size:13px;font-weight:700;color:#3b2a1e;background:#f6e7c8;border:1px solid rgba(0,0,0,.2);border-radius:8px;padding:4px 10px;cursor:pointer}
button.on{background:var(--acc);color:#fff}
.kinds{display:flex;flex-wrap:wrap;gap:4px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;max-width:1100px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h2{font-size:14px;margin:0 0 8px}
.stagebox{display:flex;justify-content:center;align-items:center;background:repeating-conic-gradient(#e9dcc2 0 25%,#f5ecdb 0 50%) 0 0/20px 20px;border-radius:10px;min-height:440px;overflow:hidden}
.stage{position:relative;width:300px;touch-action:none}
.ref{position:absolute;pointer-events:none}
.em{position:absolute;left:0;top:0;width:100%;height:100%}
.em img{position:absolute;user-select:none;-webkit-user-drag:none}
.part{cursor:grab}.part.sel{outline:2px dashed var(--sel);outline-offset:2px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 62px;gap:8px;align-items:center;margin:6px 0}
.row input[type=range]{width:100%}
.row input[type=number]{width:62px;font:inherit;font-size:13px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:4px;margin-bottom:8px}
.hint{font-size:12px;color:var(--muted)}
.lobby{position:relative;height:190px;border-radius:10px;overflow:hidden;background:#b98a58 url(../assets/lobby_iso/bg.jpg) 42% 58%/1300px auto}
.plate{position:absolute;left:40px;top:118px;display:flex;align-items:center;gap:6px;font:700 22px "MaruBuri","Malgun Gothic",serif;color:#fff3d6;text-shadow:0 0 3px #2a1a0e,0 0 3px #2a1a0e,0 0 3px #2a1a0e}
.plate i{font-style:normal;font-size:17px;color:#f2cf7a}
.plate b{width:24px;height:24px;border-radius:50%;background:#7a8a5a;border:2px solid #f2cf7a;display:inline-block}
.lemo{position:absolute}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gcell{position:relative;aspect-ratio:1/1;background:#e9dcc2;border-radius:8px;cursor:pointer}
.gcell.cur{outline:2px solid var(--sel)}
.gcell .in{position:absolute;left:16%;top:18%;width:64%}
textarea{width:100%;height:90px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
/* 움직임 (게임과 같은 값 [임시]) */
.play .em{transform-origin:var(--org);animation:life 2.6s infinite}
@keyframes life{0%{transform:scale(0);opacity:0}7%{transform:scale(1.18);opacity:1}12%{transform:scale(.94)}16%{transform:scale(1)}86%{transform:scale(1);opacity:1}100%{transform:scale(.55) translateY(-6%);opacity:0}}
.fc{position:absolute;left:0;top:0;width:100%;height:100%}
.play.win .fc{animation:hop .52s infinite ease-in-out}.play.win .a0{animation:jump .52s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}@keyframes jump{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}40%{transform:translateY(-18%) rotate(calc(var(--r,0deg) + 10deg))}}
.play.sweat .fc{animation:shiv .14s infinite}.play.sweat .a0{animation:drip 1.1s infinite ease-in}
@keyframes shiv{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5%)}}@keyframes drip{0%{transform:translateY(-10%);opacity:0}15%{opacity:1}70%{transform:translateY(30%);opacity:1}100%{transform:translateY(45%);opacity:0}}
.play.note .fc{transform-origin:50% 100%;animation:rock .8s infinite ease-in-out}.play.note .a0{animation:float 1.3s infinite ease-out}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes float{0%{transform:translate(-15%,25%) rotate(-10deg) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(15%,-30%) rotate(12deg) scale(1.05);opacity:0}}
.play.heart .a0{animation:beat .9s infinite}@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.28)}28%{transform:scale(1)}42%{transform:scale(1.2)}60%{transform:scale(1)}}
.play.anger .fc{animation:shake .2s infinite}.play.anger .a0{animation:throb .4s infinite}
@keyframes shake{0%,100%{transform:translateX(-1.8%)}50%{transform:translateX(1.8%)}}@keyframes throb{0%,100%{transform:scale(.8)}50%{transform:scale(1.22)}}
.play.smile .fc{transform-origin:50% 100%;animation:squish .7s infinite ease-in-out}.play.smile .a0{animation:tw2 .7s infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
.play.qex .a0{animation:pop1 2.6s infinite}.play.qex .fc{animation:hop2 2.6s infinite}
@keyframes pop1{0%,14%{transform:scale(0)}21%{transform:scale(1.3)}27%,100%{transform:scale(1)}}@keyframes hop2{0%,14%{transform:translateY(0)}20%{transform:translateY(-6%)}26%,100%{transform:translateY(0)}}
.play.spark .a0{animation:tw2 .8s infinite}.play.spark .fc{animation:hop .8s infinite}
@keyframes tw2{0%,100%{transform:scale(.7) rotate(0)}50%{transform:scale(1.15) rotate(18deg)}}
</style>
</head>
<body>
<div class="top">
  <h1>감정 아이콘 조절</h1>
  <div class="kinds" id="kinds"></div>
  <button id="dir">방향: 원본</button>
  <button id="refBtn" class="on">원본 겹쳐 보기</button>
  <input type="range" id="refOp" min="0" max="100" value="40" title="원본 진하기" style="width:80px">
  <button id="playBtn">▶ 움직임</button>
</div>
<div class="wrap">
  <div style="display:grid;gap:14px;min-width:0">
    <div class="card"><h2>편집 — 부품을 끌어서 옮기거나 오른쪽 막대로 조절</h2>
      <div class="stagebox"><div class="stage" id="stage"></div></div>
      <div class="hint" style="margin-top:6px">점선 테두리 = 고른 부품. 방향키 1칸 이동 (Shift = 10칸) · 「원본 겹쳐 보기」로 GPT 원본과 맞춰 볼 수 있어요.</div>
    </div>
    <div class="card"><h2>로비에서 보기 — 이름표 레벨 뒤</h2>
      <div class="lobby" id="lobby"><div class="plate"><b></b>빅터 <i id="lvTxt">Lv.11</i></div></div>
      <div class="row"><label>옆 간격</label><input type="range" id="ldx" min="-40" max="40" step="1"><input type="number" id="ldxN" step="1"></div>
      <div class="row"><label>높이</label><input type="range" id="ldy" min="-60" max="30" step="1"><input type="number" id="ldyN" step="1"></div>
      <div class="row"><label>크기</label><input type="range" id="lsz" min="30" max="110" step="1"><input type="number" id="lszN" step="1"></div>
      <div class="hint">로비 값은 8종 모두 같이 씀 (화면 1920 기준 px).</div>
    </div>
    <div class="card"><h2>8종 한눈에 (누르면 그 아이콘 편집)</h2><div class="grid" id="grid"></div></div>
  </div>
  <div style="display:grid;gap:14px;align-content:start;min-width:0">
    <div class="card"><h2 id="kTitle">부품</h2>
      <div class="seg"><button id="pe" class="on">표정</button><button id="ps">기호</button></div>
      <div class="row"><label>가로</label><input type="range" id="px" min="-0.4" max="1.2" step="0.002"><input type="number" id="pxN" step="0.005"></div>
      <div class="row"><label>세로</label><input type="range" id="py" min="-0.5" max="1" step="0.002"><input type="number" id="pyN" step="0.005"></div>
      <div class="row"><label>크기</label><input type="range" id="pw" min="0.05" max="1.2" step="0.002"><input type="number" id="pwN" step="0.005"></div>
      <div class="row"><label>회전</label><input type="range" id="pr" min="-45" max="45" step="1"><input type="number" id="prN" step="1"></div>
      <div class="seg" style="margin-top:10px"><button id="resetK">이 아이콘 처음대로</button><button id="resetAll">전부 처음대로</button></div>
    </div>
    <div class="card"><h2>결과</h2>
      <div class="seg"><button id="copy">JSON 복사</button><button id="save">파일 저장</button></div>
      <textarea id="out" readonly></textarea>
      <div class="hint">복사한 내용을 Claude 에게 붙여 주시면 게임에 반영합니다. 값은 이 브라우저에 자동 저장돼요.</div>
    </div>
  </div>
</div>
<script>
'use strict';
const KS = ['win', 'sweat', 'note', 'heart', 'anger', 'smile', 'qex', 'spark'];
const NM = { win: '해냈다!', sweat: '식은땀', note: '신남', heart: '고마워', anger: '욱', smile: '헤헤', qex: '어?!', spark: '반짝' };
// 처음 값: GPT 8종 원본에 부품을 겹쳐 맞춘 좌표 (2026-11-18). 단위 = 얼굴 가로
const DEF = {"win":{"e":{"x":0.13,"y":0.291,"w":0.752,"r":0},"s":{"x":0.879,"y":-0.021,"w":0.173,"r":0}},"sweat":{"e":{"x":0.109,"y":0.188,"w":0.758,"r":0},"s":{"x":0.752,"y":-0.024,"w":0.242,"r":0}},"note":{"e":{"x":0.133,"y":0.312,"w":0.752,"r":0},"s":{"x":0.739,"y":-0.042,"w":0.379,"r":0}},"heart":{"e":{"x":0.133,"y":0.376,"w":0.661,"r":0},"s":{"x":0.721,"y":-0.033,"w":0.376,"r":0}},"anger":{"e":{"x":0.1,"y":0.239,"w":0.791,"r":0},"s":{"x":0.782,"y":-0.073,"w":0.345,"r":0}},"smile":{"e":{"x":0.112,"y":0.321,"w":0.752,"r":0},"s":{"x":0.761,"y":-0.073,"w":0.279,"r":0}},"qex":{"e":{"x":0.076,"y":0.155,"w":0.791,"r":0},"s":{"x":0.803,"y":-0.121,"w":0.321,"r":0}},"spark":{"e":{"x":0.103,"y":0.17,"w":0.797,"r":0},"s":{"x":0.779,"y":-0.164,"w":0.364,"r":0}}};
const DEF_LOBBY = { dx: 2, dy: -4, size: 62 };
const FACE_H = 296 / 330;          // 얼굴 세로 / 가로
const REF_PAD = { l: 60, t: 120, r: 60, b: 20, fw: 330 };   // ref_*.jpg 여백 (원본 px, 얼굴 가로 330)
const IMG = n => `../assets/emote/${n}.png`;
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
let L, LB, cur = 'win', part = 'e', mirror = false, showRef = true, playing = false;
try { const v = JSON.parse(localStorage.getItem('emoteTuner') || 'null'); if (v && v.L) { L = v.L; LB = v.LB; mirror = !!v.mirror; } } catch (e) {}
L = L || clone(DEF); LB = LB || clone(DEF_LOBBY);
for (const k of KS) L[k] = L[k] || clone(DEF[k]);
function store() { try { localStorage.setItem('emoteTuner', JSON.stringify({ L, LB, mirror })); } catch (e) {} }

// 한 아이콘 그리기 (W = 얼굴 가로 px). 반전이면 얼굴 그림과 x 를 뒤집음 (기호 그림은 안 뒤집음 → "?!" 그대로 읽힘)
function build(k, W, opt = {}) {
  const P = L[k], face = mirror ? 'face' : 'face_r';
  const box = p => { const x = mirror ? 1 - p.x - p.w : p.x; return `left:${x * W}px;top:${p.y * W}px;width:${p.w * W}px;--r:${p.r || 0}deg;transform:rotate(${p.r || 0}deg)`; };
  const sel = n => opt.edit && part === n ? ' sel' : '';
  return `<div class="em" style="--org:${mirror ? '4% 96%' : '96% 96%'}"><div class="fc"><img src="${IMG(face)}" style="left:0;top:0;width:${W}px">` +
    `<img class="ft part${sel('e')}" data-p="e" src="${IMG('e_' + k)}" style="${box(P.e)}"></div>` +
    `<img class="a0 part${sel('s')}" data-p="s" src="${IMG('s_' + k)}" style="${box(P.s)}"></div>`;
}
function drawStage() {
  const W = 300, st = $('stage'); st.style.height = W * FACE_H + 'px'; st.style.marginTop = '110px';
  st.className = 'stage' + (playing ? ' play ' + cur : '');
  const sc = W / REF_PAD.fw;
  const ref = showRef && !mirror ? `<img class="ref" src="../assets/emote/ref_${cur}.jpg" style="left:${-REF_PAD.l * sc}px;top:${-REF_PAD.t * sc}px;width:${(REF_PAD.l + REF_PAD.fw + REF_PAD.r) * sc}px;opacity:${$('refOp').value / 100}">` : '';
  st.innerHTML = build(cur, W, { edit: !playing }) + ref;
  $('refBtn').disabled = mirror; $('refBtn').title = mirror ? '원본 겹쳐 보기는 「방향: 원본」에서만' : '';
}
function drawLobby() {
  const lb = $('lobby'); lb.querySelectorAll('.lemo').forEach(e => e.remove());
  const lv = $('lvTxt').getBoundingClientRect(), base = lb.getBoundingClientRect();
  const W = LB.size, x = lv.right - base.left + LB.dx - (mirror ? 0 : 0), yb = lv.top - base.top + lv.height / 2 + LB.dy;
  const d = document.createElement('div'); d.className = 'lemo' + (playing ? ' play ' + cur : '');
  d.style.cssText = `left:${mirror ? x : x}px;top:${yb - W * FACE_H}px;width:${W}px;height:${W * FACE_H}px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))`;
  d.innerHTML = build(cur, W); lb.appendChild(d);
}
function drawGrid() {
  $('grid').innerHTML = KS.map(k => `<div class="gcell${k === cur ? ' cur' : ''}" data-k="${k}"><div class="in" style="height:0;padding-bottom:${FACE_H * 72}%"><div style="position:absolute;inset:0" data-w></div></div><small style="position:absolute;bottom:2px;left:0;right:0;text-align:center">${NM[k]}</small></div>`).join('');
  $('grid').querySelectorAll('.gcell').forEach(c => { const host = c.querySelector('[data-w]'), W = host.getBoundingClientRect().width || 90; host.innerHTML = build(c.dataset.k, W); c.onclick = () => { cur = c.dataset.k; all(); }; });
}
function syncCtl() {
  const p = L[cur][part];
  for (const [id, key, f] of [['px', 'x', 3], ['py', 'y', 3], ['pw', 'w', 3], ['pr', 'r', 0]]) { $(id).value = p[key] || 0; $(id + 'N').value = (+(p[key] || 0)).toFixed(f); }
  for (const [id, key] of [['ldx', 'dx'], ['ldy', 'dy'], ['lsz', 'size']]) { $(id).value = LB[key]; $(id + 'N').value = LB[key]; }
  $('pe').classList.toggle('on', part === 'e'); $('ps').classList.toggle('on', part === 's');
  $('kTitle').textContent = `「${NM[cur]}」 부품`; $('dir').textContent = '방향: ' + (mirror ? '좌우 반전' : '원본');
  $('kinds').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === cur));
  $('playBtn').textContent = playing ? '⏸ 멈춤' : '▶ 움직임'; $('refBtn').classList.toggle('on', showRef);
  const r = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v * 1000) / 1000 : v]));
  $('out').value = JSON.stringify({ dir: mirror ? 'mirror' : 'original', lobby: LB, parts: Object.fromEntries(KS.map(k => [k, { e: r(L[k].e), s: r(L[k].s) }])) });
}
function all() { drawStage(); drawLobby(); drawGrid(); syncCtl(); store(); }
function light() { drawStage(); drawLobby(); syncCtl(); store(); }   // 끄는 중: 8종 칸은 놓을 때 다시 그림

$('kinds').innerHTML = KS.map(k => `<button data-k="${k}">${NM[k]}</button>`).join('');
$('kinds').onclick = e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.k; all(); } };
$('pe').onclick = () => { part = 'e'; light(); }; $('ps').onclick = () => { part = 's'; light(); };
$('dir').onclick = () => { mirror = !mirror; all(); };
$('refBtn').onclick = () => { showRef = !showRef; light(); }; $('refOp').oninput = light;
$('playBtn').onclick = () => { playing = !playing; all(); };
for (const [id, key] of [['px', 'x'], ['py', 'y'], ['pw', 'w'], ['pr', 'r']]) {
  const set = v => { if (!isNaN(v)) { L[cur][part][key] = v; light(); } };
  $(id).oninput = e => set(+e.target.value); $(id + 'N').onchange = e => set(+e.target.value); $(id).onchange = drawGrid;
}
for (const [id, key] of [['ldx', 'dx'], ['ldy', 'dy'], ['lsz', 'size']]) {
  const set = v => { if (!isNaN(v)) { LB[key] = v; light(); } };
  $(id).oninput = e => set(+e.target.value); $(id + 'N').onchange = e => set(+e.target.value);
}
$('resetK').onclick = () => { L[cur] = clone(DEF[cur]); all(); };
$('resetAll').onclick = () => { if ($('resetAll').dataset.ok) { L = clone(DEF); LB = clone(DEF_LOBBY); delete $('resetAll').dataset.ok; $('resetAll').textContent = '전부 처음대로'; all(); } else { $('resetAll').dataset.ok = 1; $('resetAll').textContent = '한 번 더 누르면 초기화'; setTimeout(() => { delete $('resetAll').dataset.ok; $('resetAll').textContent = '전부 처음대로'; }, 2500); } };
$('copy').onclick = () => { const t = $('out'); const ok = () => { $('copy').textContent = '복사됨 ✓'; setTimeout(() => $('copy').textContent = 'JSON 복사', 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(t.value).then(ok) : Promise.reject()).catch(() => { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} }); };
$('save').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' })); a.download = 'emote_layout.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
// 끌어서 옮기기
let drag = null;
$('stage').addEventListener('pointerdown', e => {
  const im = e.target.closest('.part'); if (!im || playing) return;
  part = im.dataset.p; const p = L[cur][part]; drag = { x0: e.clientX, y0: e.clientY, px: p.x, py: p.y };
  $('stage').setPointerCapture(e.pointerId); light(); e.preventDefault();
});
$('stage').addEventListener('pointermove', e => {
  if (!drag) return; const W = 300, dx = (e.clientX - drag.x0) / W, dy = (e.clientY - drag.y0) / W, p = L[cur][part];
  p.x = +(drag.px + (mirror ? -dx : dx)).toFixed(3); p.y = +(drag.py + dy).toFixed(3); light();
});
$('stage').addEventListener('pointerup', () => { if (drag) { drag = null; drawGrid(); } });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const st = (e.shiftKey ? 10 : 1) / 300, p = L[cur][part], m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!m) return; e.preventDefault(); p.x = +(p.x + m[0] * st * (mirror ? -1 : 1)).toFixed(3); p.y = +(p.y + m[1] * st).toFixed(3); light(); drawGrid();
});
window.addEventListener('resize', drawGrid);
all();
</script>
</body>
</html>
