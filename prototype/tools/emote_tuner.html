<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감정 아이콘 위치</title>
<!-- 2026-11-18: 감정 아이콘을 모험가 기준으로 어디에 띄울지 정하는 도구 (사용자 요청: "모험가 중심으로 위치 조절 · 높이 제한 없이 · 좌우도 · 부품은 조절할 필요 없음").
     배경 = 실제 게임 로비 화면을 1:1로 자른 것 (assets/emote/tuner_bg.jpg). 빨간 십자 = 모험가 중심 (발 위치 − 70px, 게임 actors.js 의 headY 와 발의 가운데).
     값: dx · dy = 모험가 중심 → 아이콘 가운데 (게임 화면 1920 기준 px), size = 아이콘 가로 px. 부품 배치는 GPT 원본에 맞춘 값 고정 -->
<style>
:root{--ink:#3b2a1e;--muted:#8a735a;--paper:#fffaf0;--line:rgba(120,82,44,.28);--wood:#5a3a22;--bg:#efe2c4;--acc:#c9963e}
@media (prefers-color-scheme: dark){:root{--ink:#f0e4cf;--muted:#b8a184;--paper:#2b241c;--line:rgba(230,200,160,.2);--wood:#3a2616;--bg:#1d1813;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--wood);color:#f6e7c8;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top h1{font-size:17px;margin:0 6px 0 0}
button{font:inherit;font-size:13px;font-weight:700;color:#3b2a1e;background:#f6e7c8;border:1px solid rgba(0,0,0,.2);border-radius:8px;padding:4px 10px;cursor:pointer}
button.on{background:var(--acc);color:#fff}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;max-width:1080px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h2{font-size:14px;margin:0 0 8px}
.vp{overflow:auto;border-radius:10px}
.stage{position:relative;width:600px;height:500px;background:url(../assets/emote/tuner_bg.jpg) 0 0/600px 500px;touch-action:none;transform-origin:0 0}
.cross{position:absolute;left:300px;top:250px;width:0;height:0;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#e5332a;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.cross::before{left:-14px;top:-1px;width:28px;height:2px}.cross::after{left:-1px;top:-14px;width:2px;height:28px}
.guide{position:absolute;pointer-events:none;border:1px dashed rgba(229,51,42,.8)}
.stage{cursor:default}
.lemo.dragging{cursor:grabbing}
.em{position:absolute;left:0;top:0;width:100%;height:100%}
.em img{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
.fc{position:absolute;left:0;top:0;width:100%;height:100%}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:8px;align-items:center;margin:8px 0}
.row input[type=range]{width:100%}
.row input[type=number]{width:64px;font:inherit;font-size:13px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.hint{font-size:12px;color:var(--muted)}
textarea{width:100%;height:54px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
/* 움직임 (게임과 같은 값 [임시]) */
.play .em{transform-origin:var(--org);animation:life 2.6s infinite}
@keyframes life{0%{transform:scale(0);opacity:0}7%{transform:scale(1.18);opacity:1}12%{transform:scale(.94)}16%{transform:scale(1)}86%{transform:scale(1);opacity:1}100%{transform:scale(.55) translateY(-6%);opacity:0}}
.play.win .fc{animation:hop .52s infinite ease-in-out}.play.win .a0{animation:jump .52s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18%) rotate(10deg)}}
.play.sweat .fc{animation:shiv .14s infinite}.play.sweat .a0{animation:drip 1.1s infinite ease-in}
@keyframes shiv{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5%)}}@keyframes drip{0%{transform:translateY(-10%);opacity:0}15%{opacity:1}70%{transform:translateY(30%);opacity:1}100%{transform:translateY(45%);opacity:0}}
.play.note .fc{transform-origin:50% 100%;animation:rock .8s infinite ease-in-out}.play.note .a0{animation:float 1.3s infinite ease-out}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes float{0%{transform:translate(-15%,25%) rotate(-10deg) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(15%,-30%) rotate(12deg) scale(1.05);opacity:0}}
.play.heart .a0{animation:beat .9s infinite}@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.28)}28%{transform:scale(1)}42%{transform:scale(1.2)}60%{transform:scale(1)}}
.play.anger .fc{animation:shake .2s infinite}.play.anger .a0{animation:throb .4s infinite}
@keyframes shake{0%,100%{transform:translateX(-1.8%)}50%{transform:translateX(1.8%)}}@keyframes throb{0%,100%{transform:scale(.8)}50%{transform:scale(1.22)}}
.play.smile .fc{transform-origin:50% 100%;animation:squish .7s infinite ease-in-out}.play.smile .a0{animation:tw2 .7s infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
.play.qex .a0{animation:pop1 2.6s infinite}.play.qex .fc{animation:hop2 2.6s infinite}
@keyframes pop1{0%,14%{transform:scale(0)}21%{transform:scale(1.3)}27%,100%{transform:scale(1)}}@keyframes hop2{0%,14%{transform:translateY(0)}20%{transform:translateY(-6%)}26%,100%{transform:translateY(0)}}
.play.spark .a0{animation:tw2 .8s infinite}.play.spark .fc{animation:hop .8s infinite}
@keyframes tw2{0%,100%{transform:scale(.7) rotate(0)}50%{transform:scale(1.15) rotate(18deg)}}
</style>
</head>
<body>
<div class="top">
  <h1>감정 아이콘 위치</h1>
  <div class="seg" id="kinds"></div>
  <button id="dir">그림 방향: 원본</button>
  <button id="playBtn" class="on">⏸ 멈춤</button>
  <button id="zoom">2배로 보기</button>
</div>
<div class="wrap">
  <div class="card"><h2>로비 (실제 게임 화면 1:1) — 아이콘을 끌어서 옮기세요</h2>
    <div class="vp"><div class="stage" id="stage"><canvas id="cv" width="1200" height="1000" style="position:absolute;left:0;top:0;width:600px;height:500px"></canvas><div class="cross"></div><div class="guide" id="guide"></div></div></div>
    <div class="hint" style="margin-top:6px">빨간 십자 = 모험가 중심 · 점선 = 아이콘 상자. 방향키 1px (Shift = 10px). 끄는 동안에는 움직임이 잠깐 멈춥니다.</div>
  </div>
  <div style="display:grid;gap:14px;align-content:start;min-width:0">
    <div class="card"><h2>위치 (모험가 중심 기준)</h2>
      <div class="row"><label>좌우</label><input type="range" id="dx" min="-300" max="300" step="1"><input type="number" id="dxN" step="1"></div>
      <div class="row"><label>상하</label><input type="range" id="dy" min="-250" max="250" step="1"><input type="number" id="dyN" step="1"></div>
      <div class="row"><label>크기</label><input type="range" id="sz" min="24" max="200" step="1"><input type="number" id="szN" step="1"></div>
      <div class="hint">좌우: + 오른쪽 · 상하: − 위쪽 (px). 숫자 칸에 직접 넣어도 되고, 막대 밖 값도 들어갑니다.</div>
      <div class="seg" style="margin-top:10px"><button id="reset">지금 게임 값으로</button><button id="flipPos">위치만 좌우 맞바꾸기</button></div>
      <div class="hint" id="gameVal"></div>
    </div>
    <div class="card"><h2>결과</h2>
      <div class="seg" style="margin-bottom:6px"><button id="copy">JSON 복사</button><button id="save">파일 저장</button></div>
      <textarea id="out" readonly></textarea>
      <div class="hint">복사한 내용을 Claude 에게 붙여 주시면 게임에 반영합니다. 값은 이 브라우저에 자동 저장돼요.</div>
    </div>
  </div>
</div>
<script src="../js/emote.js"></script>
<script>
'use strict';
// 2026-11-18 고침: 게임과 똑같이 보이도록 게임의 js/emote.js 로 그림 (부품 배치 · 움직임 · 반전 모두 같은 코드).
// 처음 값 = 지금 게임 값 (Emote.POS). 브라우저에 저장된 값은 "그때의 게임 값"이 지금과 같을 때만 이어서 씀 (예전 값이 덮어쓰지 않게)
Emote.base = '../assets/emote/'; Emote.preload();
const KS = Emote.KINDS, NM = Emote.NAME, FACE_H = 296 / 330, CX = 300, CY = 250;   // 배경 속 모험가 중심 (발 − 70px)
const GAME = { dx: Emote.POS.dx, dy: Emote.POS.dy, size: Emote.POS.size, mirror: !!Emote.POS.mirror };
const $ = id => document.getElementById(id);
let V = Object.assign({}, GAME), cur = 'win', playing = true, zoom = 1, drag = null, t0 = performance.now();
try { const s = JSON.parse(localStorage.getItem('emotePos2') || 'null'); if (s && s.game && JSON.stringify(s.game) === JSON.stringify(GAME)) V = Object.assign(V, s.V); } catch (e) {}
const store = () => { try { localStorage.setItem('emotePos2', JSON.stringify({ V, game: GAME })); } catch (e) {} };
$('gameVal').textContent = `지금 게임 값: 좌우 ${GAME.dx} · 상하 ${GAME.dy} · 크기 ${GAME.size} · 그림 ${GAME.mirror ? '좌우 반전' : '원본'}`;
const g = $('cv').getContext('2d');
function frame(now) {
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 600, 500);
  const life = 2.6, t = ((now - t0) / 1000) % life, age = playing && !drag ? t : 1, remain = playing && !drag ? life - t : 9;
  Emote.draw(g, cur, CX + V.dx, CY + V.dy, age, remain, { mirror: V.mirror, size: V.size });
  requestAnimationFrame(frame);
}
function ui() {
  const W = V.size, H = W * FACE_H, x = CX + V.dx - W / 2, y = CY + V.dy - H / 2;
  Object.assign($('guide').style, { left: x + 'px', top: y + 'px', width: W + 'px', height: H + 'px' });
  for (const k of ['dx', 'dy']) { $(k).value = V[k]; $(k + 'N').value = V[k]; } $('sz').value = V.size; $('szN').value = V.size;
  $('dir').textContent = '그림 방향: ' + (V.mirror ? '좌우 반전' : '원본'); $('playBtn').textContent = playing ? '⏸ 멈춤' : '▶ 움직임'; $('playBtn').classList.toggle('on', playing);
  $('kinds').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === cur));
  $('out').value = JSON.stringify({ dir: V.mirror ? 'mirror' : 'original', anchor: '모험가 중심 (발 − 70px)', dx: V.dx, dy: V.dy, size: V.size });
  store();
}
$('kinds').innerHTML = KS.map(k => `<button data-k="${k}">${NM[k]}</button>`).join('');
$('kinds').onclick = e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.k; t0 = performance.now(); ui(); } };
$('dir').onclick = () => { V.mirror = !V.mirror; ui(); };
$('flipPos').onclick = () => { V.dx = -V.dx; ui(); };
$('playBtn').onclick = () => { playing = !playing; t0 = performance.now(); ui(); };
$('zoom').onclick = () => { zoom = zoom === 1 ? 2 : 1; const st = $('stage'); st.style.transform = `scale(${zoom})`; st.parentElement.style.height = 500 * zoom + 'px'; st.style.marginRight = (600 * (zoom - 1)) + 'px'; $('zoom').textContent = zoom === 1 ? '2배로 보기' : '1배로 보기'; };
for (const [id, key] of [['dx', 'dx'], ['dy', 'dy'], ['sz', 'size']]) {
  const set = v => { if (!isNaN(v)) { V[key] = Math.round(v); ui(); } };
  $(id).oninput = e => set(+e.target.value); $(id + 'N').onchange = e => set(+e.target.value);
}
$('reset').onclick = () => { V = Object.assign({}, GAME); ui(); };
$('copy').onclick = () => { const t = $('out'), ok = () => { $('copy').textContent = '복사됨 ✓'; setTimeout(() => $('copy').textContent = 'JSON 복사', 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(t.value).then(ok) : Promise.reject()).catch(() => { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} }); };
$('save').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' })); a.download = 'emote_pos.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('stage').addEventListener('pointerdown', e => {
  const r = $('stage').getBoundingClientRect(), px = (e.clientX - r.left) / zoom, py = (e.clientY - r.top) / zoom, W = V.size, H = W * FACE_H;
  if (Math.abs(px - (CX + V.dx)) > W / 2 + 8 || Math.abs(py - (CY + V.dy)) > H / 2 + 8) return;
  drag = { x0: e.clientX, y0: e.clientY, dx: V.dx, dy: V.dy }; $('stage').setPointerCapture(e.pointerId); e.preventDefault();
});
$('stage').addEventListener('pointermove', e => { if (!drag) return; V.dx = Math.round(drag.dx + (e.clientX - drag.x0) / zoom); V.dy = Math.round(drag.dy + (e.clientY - drag.y0) / zoom); ui(); });
$('stage').addEventListener('pointerup', () => { if (drag) { drag = null; t0 = performance.now(); } });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!m) return;
  e.preventDefault(); const s = e.shiftKey ? 10 : 1; V.dx += m[0] * s; V.dy += m[1] * s; ui();
});
ui(); requestAnimationFrame(frame);
</script>
</body>
</html>
