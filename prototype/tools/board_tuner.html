<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>게시판 정렬 도구</title>
<style>
body{margin:0;background:#2b2118;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#f1e6cf}
#wrap{display:flex;gap:12px;padding:10px}
#view{position:relative;overflow:auto;border:2px solid #6b4a2b;border-radius:8px;background:#000;flex:1;height:calc(100vh - 24px)}
canvas{display:block;cursor:grab}
#side{width:300px;flex:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
fieldset{border:1px solid #6b4a2b;border-radius:8px;padding:8px 10px}
legend{color:#e9c27a;font-weight:700}
label{display:flex;align-items:center;gap:6px;margin:4px 0}
label span{width:92px;flex:none}
input[type=range]{flex:1}
output{width:46px;text-align:right;font-variant-numeric:tabular-nums}
button{background:#e2b24f;border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
textarea{width:100%;height:110px;background:#1b140e;color:#e9dcc0;border:1px solid #6b4a2b;border-radius:6px;font:12px monospace}
.hint{color:#bfae8e;font-size:12px;line-height:1.5}
</style></head><body><div id="wrap">
<div id="view"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="side">
<fieldset><legend>보기</legend>
<label><span>확대</span><select id="zoom"><option value="1">1배 (실제)</option><option value="2" selected>2배</option><option value="3">3배</option></select></label>
<label><input type="checkbox" id="grid" checked> 칸 테두리 보기</label>
<label><input type="checkbox" id="full" checked> 12칸 모두 채워 보기</label></fieldset>
<fieldset><legend>의뢰서 묶음</legend>
<div class="hint">게시판 위를 끌면 묶음 전체가 이동합니다. 방향키 1px, Shift+방향키 10px.</div>
<label><span>위치 X</span><input type="range" id="ox" min="400" max="700" step="1"><output></output></label>
<label><span>위치 Y</span><input type="range" id="oy" min="250" max="500" step="1"><output></output></label>
<label><span>너비 (벽 방향)</span><input type="range" id="len" min="150" max="320" step="1"><output></output></label>
<label><span>높이</span><input type="range" id="hh" min="60" max="160" step="1"><output></output></label>
<label><span>기울기</span><input type="range" id="sl" min="-0.6" max="-0.3" step="0.005"><output></output></label>
<label><span>종이 크기</span><input type="range" id="ps" min="0.6" max="1" step="0.01"><output></output></label>
<label><span>인장 크기</span><input type="range" id="ss" min="0.3" max="0.7" step="0.01"><output></output></label></fieldset>
<fieldset><legend>메인 퀘스트</legend>
<label><span>자리</span><select id="mm"><option value="B">B. 가운데 위 (크게)</option><option value="A">A. 왼쪽 위 첫 칸</option><option value="N">없음</option></select></label>
<label><span>좌우 (B)</span><input type="range" id="mx" min="-80" max="80" step="1"><output></output></label>
<label><span>위아래 (B)</span><input type="range" id="my" min="-60" max="60" step="1"><output></output></label>
<label><span>크기 (B)</span><input type="range" id="msz" min="1" max="1.6" step="0.01"><output></output></label></fieldset>
<button id="reset">처음 값으로</button>
<fieldset><legend>값 (Claude에게 붙여 주세요)</legend><textarea id="out" readonly></textarea><button id="copy">복사</button></fieldset>
</div></div>
