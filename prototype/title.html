<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collegium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+Runic&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 레이아웃: 16:9 타이틀 무대 하나 + 아래 조절 막대. 타이틀 화면이라 어두운 단일 테마 */
:root{--bg:#07080b;--stage:#0b0d12;--line:#2a2f3a;--panel:#12151c;--fg:#eef1f6;--mute:#9aa3b2;--accent:#d9c08a;color-scheme:dark;
--title:"Cinzel","Trajan Pro",Georgia,serif;--ui:"Gowun Dodum","Malgun Gothic",system-ui,sans-serif}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px}.sub{margin:0;color:var(--mute);font-size:13px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:linear-gradient(#3f86d4 0%,#7fbfee 55%,#a9dcf5 100%);border:1px solid var(--line);border-radius:6px;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
input[type=range]{accent-color:var(--accent);width:110px}
button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 문자 효과 단추 묶음: 고른 것은 금색 테두리 */
.seg{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-bottom:8px;border-bottom:1px solid var(--line)}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:rgba(217,192,138,.08)}
b.v{color:var(--fg);font-weight:400;min-width:2.5em;font-variant-numeric:tabular-nums}
/* ── 게임 본편에 끼워 넣는 모드: 조절 막대·설명을 감추고(값은 기본값 그대로 유지) 화면 가득 채움 ── */
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{padding:0}.wrap{max-width:none;margin:0;display:block}
.wrap>div:first-child,.bar{display:none}
.stage{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0;background:#000}
</style>
</head>
<body>
<div class="wrap">
<div><h1>Collegium 타이틀 (확정안 2026-11-02)</h1><p class="sub">위 단추로 문자 효과를 바꿔 볼 수 있습니다. 누르면 처음부터 다시 재생됩니다. 등장이 끝나면 어느 효과든 글자에 가끔 빛이 맺힙니다.</p></div>
<div class="stage"><svg id="sv" viewBox="0 0 1600 900" aria-label="COLLEGIUM 타이틀과 마법진"></svg></div>
<div class="bar">
<div class="seg" role="group" aria-label="저장 칸 시안">
<span style="color:var(--mute);font-size:13px;align-self:center">저장 칸 시안</span><button data-sv="0" aria-pressed="true">끄기</button><button data-sv="B" aria-pressed="false">B 세로 카드 (확정)</button><button data-sv="A" aria-pressed="false">A 가로 3줄</button>
<span style="color:var(--mute);font-size:13px;align-self:center;margin-left:12px">들어온 곳</span><button data-sm="new" aria-pressed="true">새 게임</button><button data-sm="load" aria-pressed="false">이어하기</button>
<label for="mny" style="margin-left:12px">메뉴 위치 <input id="mny" type="range" min="400" max="860" step="4" value="818"><b class="v" id="mnyv">818</b></label>
<label for="mnx">메뉴 간격 <input id="mnx" type="range" min="140" max="360" step="4" value="230"><b class="v" id="mnxv">230</b></label>
<label><input type="checkbox" id="nosave"> 저장 기록 없음</label>
<label for="sgap" style="margin-left:12px">카드 간격 <input id="sgap" type="range" min="0" max="200" step="2" value="140"><b class="v" id="sgapv">140</b></label>
</div>
<div class="seg" role="group" aria-label="문자 효과">
<button data-m="0" aria-pressed="false">지금 버전</button><button data-m="1" aria-pressed="false">① 외곽선→채움</button><button data-m="2" aria-pressed="false">② 글자 안 빛 띠</button><button data-m="3" aria-pressed="false">③ 부제 장식선</button><button data-m="9" aria-pressed="true">②③ 함께 (기본)</button>
</div>
<button id="replay">다시 재생</button>
<label for="spd">등장 속도 <input id="spd" type="range" min="0.4" max="2.5" step="0.1" value="1"><b class="v" id="spdv">1.0×</b></label>
<label for="rot">회전 속도 <input id="rot" type="range" min="0" max="3" step="0.1" value="1"><b class="v" id="rotv">1.0×</b></label>
<label for="glow">발광 <input id="glow" type="range" min="0" max="2" step="0.1" value="1"><b class="v" id="glowv">1.0×</b></label>
<label><input type="checkbox" id="runes" checked> 룬 문자 띠</label>
<label><input type="checkbox" id="parts" checked> 입자</label>
<label><input type="checkbox" id="layers" checked> 그림 레이어</label>
<label for="runv">달리기 속도 <input id="runv" type="range" min="0" max="480" step="8" value="280"><b class="v" id="runvv">280</b></label>
<label for="strd">보폭 <input id="strd" type="range" min="2" max="24" step="1" value="13"><b class="v" id="strdv">13</b></label>
<label for="lenm">지형 길이 <input id="lenm" type="range" min="1" max="30" step="1" value="30"><b class="v" id="lenmv">30×</b></label>
<label for="objd">오브젝트 밀도 <input id="objd" type="range" min="0" max="3" step="0.25" value="1"><b class="v" id="objdv">1.0</b></label>
<label for="tsc">타이틀 크기 <input id="tsc" type="range" min="0.5" max="1" step="0.05" value="0.8"><b class="v" id="tscv">0.80</b></label>
<label><input type="checkbox" id="fgon" checked> 전경</label>
<label><input type="checkbox" id="evon" checked> 움직이는 장식(나비·닭·마른 덤불)</label>
<label for="pgap">줄 간격 <input id="pgap" type="range" min="30" max="120" step="2" value="62"><b class="v" id="pgapv">62</b></label>
<label for="gnd">지면 높이 <input id="gnd" type="range" min="200" max="400" step="2" value="400"><b class="v" id="gndv">400</b></label>
<label for="lay">배치 <select id="lay"><option value="b3">B3 구성</option><option value="below">제목 아래</option><option value="over">제목 겹침</option></select></label>
</div>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv'),CX=800,CY=430,R=300;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e;};
// 발광 필터
const defs=el('defs',{});
const f=el('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);

const sweep=el('linearGradient',{id:'sweep',x1:'0',x2:'1',y1:'0',y2:'0'},defs);
el('stop',{offset:'0',['stop-color']:'#fff','stop-opacity':'0'},sweep);const sMid=el('stop',{offset:'0.5',['stop-color']:'#fff','stop-opacity':'1'},sweep);el('stop',{offset:'1',['stop-color']:'#fff','stop-opacity':'0'},sweep);
const circlePath=(r,cx=CX,cy=CY)=>`M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`;

const S=(e,start,dur)=>{strokes.push({e,start,dur});return e;};

S(el('path',{d:circlePath(R-12),'stroke-width':1,opacity:.6},gOuter),0.2,1.6);

for(let i=0;i<72;i++){const a=i/72*Math.PI*2,l=i%6===0?14:6,r1=R-12,r2=R-12-l;

// 룬 문자 띠
const runeText=el('text',{fill:'#e9eef8',stroke:'none','font-family':'Noto Sans Runic, serif','font-size':22,'letter-spacing':9,opacity:0},gRune);
const tp=el('textPath',{href:'#runePath',startOffset:'0'},runeText);

S(el('path',{d:circlePath(R-50),'stroke-width':1,opacity:.5},gRune),0.6,1.4);

S(el('path',{d:circlePath(205),'stroke-width':1.6,opacity:.85},gInner),0.8,1.4);
S(el('path',{d:circlePath(190),'stroke-width':0.8,opacity:.45},gInner),1.0,1.4);
const sq=150;S(el('rect',{x:CX-sq,y:CY-sq,width:sq*2,height:sq*2,'stroke-width':1.3,opacity:.75},gInner),1.3,1.2);
S(el('rect',{x:CX-sq+16,y:CY-sq+16,width:(sq-16)*2,height:(sq-16)*2,'stroke-width':0.7,opacity:.4},gInner),1.5,1.2);

 const st=el('path',{d:`M ${CX} ${cy-26} Q ${CX+3} ${cy-3} ${CX+26} ${cy} Q ${CX+3} ${cy+3} ${CX} ${cy+26} Q ${CX-3} ${cy+3} ${CX-26} ${cy} Q ${CX-3} ${cy-3} ${CX} ${cy-26} Z`,fill:'#fff',stroke:'none',opacity:0},gSmall);

window.__titleEvent=rg=>spawnEvent(rg); // 확인용: 장식 즉시 등장
window.__titleJump=f=>{camX=f*COLS.length*32;const lead=party.filter(c=>c.st!=='leave').sort((a,b)=>b.wx-a.wx)[0];const off=camX+400-lead.wx;party.forEach(c=>c.wx+=off);chX=400;}; // 확인용: 길의 원하는 비율 위치로 이동

document.getElementById('lenm').oninput=e=>{const m=+e.target.value,old=COLS.length;document.getElementById('lenmv').textContent=m+'×';const r=(camX/32)/old;buildCols(m);camX=r*COLS.length*32;};
// 땅 위치: 윗줄 블록 몸통 y=322(그림은 −12), 지면선 y=318, 아랫줄 3줄
let GY=400,SURF=GY-4;const RUN={w:128,h:96,ax:64,ay:92,n:8,ms:75};
let camX=0,chX=-80,dist=0; // chX: 맨 앞 캐릭터의 화면 x. 다리 동작은 각자 달린 거리로 넘어가 땅과 발이 미끄러지지 않게 함
// ── 무리: 최대 5명이 한 줄로 달림. 뒤에서 1~4명이 빠르게 합류, 가끔 한 명이 앞으로 빠져나감 ──
const ROSTER=['warrior_m','warrior_f','archer_f','archer_m','cleric_f','cleric_m','mage_f','mage_m','rogue_f','rogue_m'];
const PARTY_MAX=5,JOIN_V=150,LEAVE_V=220;
let party=[{k:'warrior_m',wx:-80,d:0,st:'line'}],partyT=6; // st: line(줄 서서 따라감) / join(합류 중) / leave(빠져나가는 중)
function partyEvent(){const line=party.filter(c=>c.st!=='leave');const free=ROSTER.filter(k=>!party.some(c=>c.k===k));
 const canJoin=PARTY_MAX-party.length,canLeave=line.length>=2;
 if(canJoin>0&&(Math.random()<0.65||!canLeave)){ // 1~4명이 뒤에서 함께 달려옴
  const n=Math.min(canJoin,1+Math.floor(Math.random()*Math.min(4,canJoin)),free.length);const tail=Math.min(...line.map(c=>c.wx));
  for(let i=0;i<n;i++){const k=free.splice(Math.floor(Math.random()*free.length),1)[0];party.push({k,wx:camX-120-i*70-Math.random()*20,d:Math.random()*100,st:'join'});}}
 else if(canLeave){const c=line[Math.floor(Math.random()*line.length)];c.st='leave';}}
function updateParty(dt,v){const gap=+$('pgap').value;$('pgapv').textContent=gap;
 // 줄 순서: 앞(오른쪽)부터. 떠나는 캐릭터는 줄에서 빠짐
 const line=party.filter(c=>c.st!=='leave').sort((a,b)=>b.wx-a.wx);
 const lead=line[0];
 for(const c of party){let sp;
  if(c===lead){sp=v;}
  else if(c.st==='leave'){sp=v+LEAVE_V;}
  else{const idx=line.indexOf(c),target=lead.wx-idx*gap,diff=target-c.wx;
   sp=diff>4?v+Math.min(c.st==='join'?JOIN_V:90,diff*3):diff<-4?Math.max(v*0.6,v+diff*2):v;if(c.st==='join'&&Math.abs(diff)<6)c.st='line';}
  c.wx+=sp*dt;c.d+=sp*dt;}
 // 카메라: 맨 앞 캐릭터를 화면 가운데(400)에 둠. 앞 캐릭터가 바뀌면 부드럽게 넘어감
 if(lead){const tx=lead.wx-400;if(tx>camX)camX+=Math.min(tx-camX,Math.max(v*dt,(tx-camX)*Math.min(1,dt*2.5)));else camX+=v*dt*0.5;}
 party=party.filter(c=>!(c.st==='leave'&&c.wx-camX>880));
 if(lead)chX=lead.wx-camX;
 if(chX>=399){partyT-=dt;if(partyT<=0){partyT=7+Math.random()*8;partyEvent();}}}
window.__titleParty=()=>partyEvent(); // 확인용
function drawPixel(dt){
 const v=+$('runv').value;$('runvv').textContent=v;
 // 등장: 캐릭터가 왼쪽 밖에서 들어와 화면 가운데(400)에 닿으면 그때부터 카메라가 따라감
 updateParty(dt,v);dist+=v*dt;
 GY=+$('gnd').value;SURF=GY-4;$('gndv').textContent=GY; // 지면 높이(도트, 윗줄 블록 몸통의 위쪽 끝)
 pg.clearRect(0,0,800,450);const cx=Math.round(camX),N=COLS.length;
 const c0=Math.floor(cx/32);
 for(let i=c0;i<=c0+26;i++){const col=COLS[((i%N)+N)%N],x=i*32-cx;
  for(let j=1;GY+32*j<450;j++){const im=IM[col[1+(j-1)%3]];if(im.complete)pg.drawImage(im,x,GY+32*j);}} // 화면 아래까지 아랫줄 3종을 반복
const LOOP=N*32;
 for(const o of OBJS){const im=IM[o.k];if(!im.complete)continue;let x=o.x-(cx%LOOP);if(x<-200)x+=LOOP;if(x>800)continue;pg.drawImage(im,x,SURF+2-im.naturalHeight);}
 for(let i=c0;i<=c0+26;i++){const col=COLS[((i%N)+N)%N],im=IM[col[0]];if(im.complete)pg.drawImage(im,i*32-cx,GY-12);}
 // 보폭 = 달리기 1프레임 동안 땅이 지나가는 도트 수. 속도를 바꿔도 발과 땅의 비율은 그대로
 const st=+$('strd').value;$('strdv').textContent=st;
 // 뒤쪽 캐릭터부터 그려 앞 캐릭터가 위에 오게 함
 for(const c of party.slice().sort((a,b)=>a.wx-b.wx)){const im=IM['run_'+c.k];if(!im||!im.complete)continue;const fr=Math.floor(c.d/st)%RUN.n;
  pg.drawImage(im,fr*RUN.w,0,RUN.w,RUN.h,Math.round(c.wx-camX)-RUN.ax,SURF-RUN.ay,RUN.w,RUN.h);}
 drawFront(dt,v);
}
function layout(){MODE=$('lay').value;const below=MODE==='below',b3=MODE==='b3';
 gWrap.setAttribute('transform',below?`translate(${CX} 318) scale(0.7) translate(${-CX} ${-CY})`:'');
 title.setAttribute('y',b3?482:below?712:CY+40);subt.setAttribute('y',b3?527:below?762:CY+92);shine.setAttribute('y',b3?372:below?602:CY-70);press.setAttribute('y',818);} // 땅과 겹치게
// 길이 측정
for(const s of strokes){const L=s.e.getTotalLength?s.e.getTotalLength():0;s.L=L;s.e.style.strokeDasharray=L;s.e.style.strokeDashoffset=L;}
// 조절값
const $=id=>document.getElementById(id);let spd=1,rot=1,glow=1,t0=performance.now(),last=t0,T=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bind=(id,cb)=>{const e=$(id);e.oninput=()=>{cb(+e.value);$(id+'v').textContent=(+e.value).toFixed(1)+'×';};};
bind('spd',v=>spd=v);bind('rot',v=>rot=v);bind('glow',v=>{glow=v;gb.setAttribute('stdDeviation',(4*v).toFixed(1));});
$('replay').onclick=()=>{T=0;nextGlint=4.6;};
let FX=9;const has=n=>FX===n||(FX===9&&n!==1); // 기본(9) = ②③ 함께, ① 외곽선은 뺄
document.querySelectorAll('.seg button[data-m]').forEach(b=>b.onclick=()=>{FX=+b.dataset.m;document.querySelectorAll('.seg button[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));T=0;nextGlint=4.6;});
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
let angO=0,angR=0,angI=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt*spd*(reduce?20:1);drawPixel(dt);
 for(const s of strokes){const p=ease((T-s.start)/s.dur);s.e.style.strokeDashoffset=s.L*(1-p);}
 const rr=dt*rot*(reduce?0:1);angO+=rr*3;angR-=rr*6;angI+=rr*1.5;
 gOuter.setAttribute('transform',`rotate(${angO} ${CX} ${CY})`);
 gRune.setAttribute('transform',`rotate(${angR} ${CX} ${CY})`);
 gInner.setAttribute('transform',`rotate(${angI*0} ${CX} ${CY})`);
 runeText.setAttribute('opacity',$('runes').checked?(.75*ease((T-2.2)/1.2)).toFixed(3):0);
 for(const s of stars){const p=ease((T-2.4)/0.5),tw=.75+.25*Math.sin(now/400+s.cy);s.e.setAttribute('opacity',(p*tw).toFixed(3));
  s.e.setAttribute('transform',`translate(${s.cx} ${s.cy}) scale(${(0.4+0.6*p)*(.9+.1*tw)}) translate(${-s.cx} ${-s.cy})`);}
 for(const L of layers){const p=$('layers').checked&&L.m===MODE?ease((T-L.st)/0.7):0;const ox=L.d[0]*(1-p),oy=L.d[1]*(1-p),fl=1+0.025*Math.sin(now/1300+L.st*3);
  L.g.setAttribute('opacity',p.toFixed(3));L.g.setAttribute('transform',`translate(${(L.x+ox).toFixed(1)} ${(L.y+oy+(T>3.5?2*Math.sin(now/1100):0)).toFixed(1)}) rotate(${L.a}) scale(${((0.92+0.08*p)*(T>3.5?fl:1)).toFixed(4)})`);}
 // 제목 등장
 const f1=has(1);tLine.setAttribute('y',title.getAttribute('y'));
 if(f1){const ls=ease((T-2.8)/1.0);title.setAttribute('letter-spacing',10);
  const dl=ease((T-2.8)/1.3),fl=ease((T-3.8)/0.7);
  tLine.setAttribute('opacity',(T<2.8?0:fl<1?1:Math.max(0,1-(T-4.5)/0.6)).toFixed(3));tLine.style.strokeDasharray='700 700';tLine.style.strokeDashoffset=(700*(1-dl)).toFixed(1);
  title.setAttribute('fill','url(#silver)');title.setAttribute('opacity',fl.toFixed(3));}
 else{tLine.setAttribute('opacity',0);title.setAttribute('fill',has(2)?'url(#silver)':'#ffffff');const tp1=ease((T-2.8)/1.0);title.setAttribute('opacity',tp1.toFixed(3));title.setAttribute('letter-spacing',(10+18*(1-tp1)).toFixed(1));}
 const sT=f1?4.0:3.4;subt.setAttribute('opacity',ease((T-sT)/0.8).toFixed(3));
 // 빛 띠: 기본은 사각 덧칠, ②는 글자 안에서만
 const swS=f1?4.6:3.6,sw=(T-swS)/1.1,ty=+title.getAttribute('y');
 if(has(2)){shine.setAttribute('opacity',0);bandR.setAttribute('opacity',sw>0&&sw<1?1:0);bandR.setAttribute('x',(CX-700+sw*1300).toFixed(1));bandR.setAttribute('y',ty-130);bandR.setAttribute('transform',`skewX(-20)`);bandR.setAttribute('x',(CX-560+sw*1300).toFixed(1));}
 else{bandR.setAttribute('opacity',0);shine.setAttribute('opacity',sw>0&&sw<1?(Math.sin(sw*Math.PI)*.9).toFixed(3):0);shine.setAttribute('x',(CX-560+sw*960).toFixed(1));}
 // 장식선
 if(has(3)){let tw=0;try{tw=subt.getComputedTextLength();}catch(e){}const sy=+subt.getAttribute('y')-10,p=ease((T-sT-0.3)/0.7);
  for(const d of deco){const x0=CX+d.s*(tw/2+22),x1=x0+d.s*150*p;d.l.setAttribute('x1',x0);d.l.setAttribute('x2',x1);d.l.setAttribute('y1',sy);d.l.setAttribute('y2',sy);d.l.setAttribute('opacity',p>0?.9:0);
   d.d.setAttribute('transform',`translate(${x1+d.s*8} ${sy})`);d.d.setAttribute('opacity',ease((T-sT-0.9)/0.3).toFixed(3));}}
 else for(const d of deco){d.l.setAttribute('opacity',0);d.d.setAttribute('opacity',0);}
 // 시작 안내: 5.2초부터 나타나 2.6초 주기로 0.35~1 사이 숨쉬기, 누르면 잠깐 밝게 번쩍
 {const a=ease((T-5.2)/0.8),br=0.675+0.325*Math.cos((T-6)*Math.PI*2/2.6),hit=Math.max(0,1-(T-pressHit)/0.5);
  press.setAttribute('opacity',(a*Math.min(1,br+hit)).toFixed(3));press.setAttribute('letter-spacing',(11+4*hit).toFixed(1));
  press.style.filter=hit>0?`drop-shadow(0 0 ${(4+10*hit).toFixed(1)}px rgba(230,238,255,${(0.8*hit).toFixed(2)}))`:'';}
 // 공통 반짝임: 등장 후 2~4.5초마다 글자 한 곳에 빛이 맺힘
 if(T>nextGlint&&!reduce){nextGlint=T+2+Math.random()*2.5;
  const n=title.getNumberOfChars(),i=Math.floor(Math.random()*n);let bx;try{bx=title.getExtentOfChar(i);}catch(e){}
  if(bx){const cx=bx.x+bx.width*(Math.random()<.5?.2:.8),cy=bx.y+bx.height*(.3+Math.random()*.15);
   // 빛 맺힘: 작은 광점 하나 + 사방으로 흩어지는 입자 10~16개
   const core=el('circle',{cx:cx,cy:cy,r:3,fill:'#fff',filter:'url(#glow)',opacity:0},gGl);glints.push({e:core,t:0,max:0.7});
   const n2=10+Math.floor(Math.random()*7);
   for(let j=0;j<n2;j++){const ang=Math.random()*Math.PI*2,v=30+Math.random()*80;
    sparks.push({e:el('circle',{r:1,fill:'#fff',opacity:0},gGl),x:cx,y:cy,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v-12,t:-Math.random()*0.12,max:0.6+Math.random()*0.7,r:1.3+Math.random()*1.6});}}}
 for(let i=glints.length-1;i>=0;i--){const G=glints[i];G.t+=dt;const k=G.t/G.max,a=Math.sin(Math.min(1,k)*Math.PI);
  G.e.setAttribute('opacity',a.toFixed(3));G.e.setAttribute('r',(2+3*a).toFixed(2));if(k>=1){G.e.remove();glints.splice(i,1);}}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;if(s.t<0)continue;const k=s.t/s.max;
  s.vx*=Math.pow(0.12,dt);s.vy=s.vy*Math.pow(0.12,dt)-8*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
  s.e.setAttribute('cx',s.x.toFixed(1));s.e.setAttribute('cy',s.y.toFixed(1));s.e.setAttribute('r',(s.r*(1-k*.6)).toFixed(2));
  s.e.setAttribute('opacity',(Math.min(1,k*6)*(1-k)*(0.6+0.4*Math.sin(s.t*40))).toFixed(3));
  if(k>=1){s.e.remove();sparks.splice(i,1);}}
 // 반짝임과 함께 제목 전체가 잠깐 밝아짐
 const gl=glints.reduce((m,G)=>Math.max(m,Math.sin(Math.min(1,G.t/G.max)*Math.PI)),0);title.style.filter=gl>0.05?`drop-shadow(0 0 ${(4+6*gl).toFixed(1)}px rgba(220,232,255,${(0.35*gl).toFixed(2)}))`:'';
 const pulse=1+0.12*Math.sin(now/900);gAll.setAttribute('opacity',(T>3?0.85*pulse:0.95).toFixed(3));
 if($('parts').checked&&T>2&&Math.random()<dt*14*Math.max(.3,glow)){const a=Math.random()*Math.PI*2,r=R*(0.4+Math.random()*0.6);
  parts.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,vy:-(14+Math.random()*24),life:0,max:2+Math.random()*2,s:1+Math.random()*2.2,e:el('circle',{r:2},gP)});}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.y+=p.vy*dt;p.x+=Math.sin((p.life+i)*2)*6*dt;const k=p.life/p.max;
  p.e.setAttribute('cx',p.x.toFixed(1));p.e.setAttribute('cy',p.y.toFixed(1));p.e.setAttribute('r',(p.s*(1-k*.5)).toFixed(2));p.e.setAttribute('opacity',(Math.sin(k*Math.PI)*.8).toFixed(3));
  if(k>=1){p.e.remove();parts.splice(i,1);}}
 requestAnimationFrame(frame);}
$('lay').onchange=layout;layout();
requestAnimationFrame(frame);
})();
