<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이세계 모험가 길드 · 2차 프로토타입</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1410;color:#2b1e15;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
#game{position:fixed;inset:0}
.stage-host{position:relative;overflow:hidden}
.stage-box{position:absolute}
.stage-canvas{position:absolute;left:0;top:0;display:block}
.stage-ui{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none;font-size:22px}
.stage-ui *{pointer-events:auto}
:root{--wood:#3a2618;--wood2:#5a3a22;--cream:#fbf1dc;--gold:#e8b44a;--ink:#3b2a1e;--muted:#8a7258}
/* 등급 배지 */
.gb{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 17px Georgia,serif;color:#fff8e8;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);vertical-align:middle;margin-right:6px}
.gb.big{width:44px;height:44px;font-size:24px;margin:0}
.g0{background:#8d8d8d}.g1{background:#3fa04a}.g2{background:#2f6fd0}.g3{background:#8a4fd0}.g4{background:#e0782a}.g5{background:#d0302c}.g6{background:#e2b11f;color:#3b2a0a}
/* 공통 패널 (나무 테두리 + 크림 바탕) */
.plate{position:absolute;background:linear-gradient(#fff8e8,#f3e3c2);color:var(--ink);border:4px solid var(--wood2);border-radius:18px;box-shadow:0 6px 0 rgba(58,38,24,.55),0 10px 24px rgba(0,0,0,.25)}
/* 왼쪽 위: 길드 상태 */
#hudTL{position:absolute;left:22px;top:12px;--h:118;height:calc(var(--h)*1px);display:flex;align-items:center;color:var(--ink);z-index:4}
#hudTL .pm{position:absolute;top:0;bottom:0;left:calc(var(--h)*.774px - 4px);right:calc(var(--h)*.774px - 4px);background:url(assets/ui/hud/plaque_mid.png) 0 0/100% 100% no-repeat}
#hudTL .pl,#hudTL .pr{position:absolute;top:0;height:100%;width:calc(var(--h)*.774px);background:url(assets/ui/lina_menu/btn_selected.png) no-repeat;background-size:auto 100%}
#hudTL .pl{left:0;background-position:left top}#hudTL .pr{right:0;background-position:right top}
#hudTL .in{position:relative;display:flex;align-items:center;height:calc(100% - 11px);padding:0 52px 0 56px}
#hGrade{flex:none;width:68px;height:69px;background:center/contain no-repeat;margin-right:14px;filter:drop-shadow(0 2px 1px rgba(58,38,24,.35))}
#hudTL .dt{position:relative;min-width:150px}#hudTL .date{font-weight:700;font-size:24px;white-space:nowrap}
#hudTL .sep{width:3px;height:44px;background:linear-gradient(transparent,rgba(138,114,88,.55),transparent);margin:0 18px;flex:none}
#hudTL .stat{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:18px;color:var(--muted);font-weight:700}
#hudTL .stat img{height:44px;width:auto;filter:drop-shadow(0 2px 1px rgba(90,58,34,.4))}
#hudTL .stat .lb{font-size:17px;line-height:1;display:block;margin-bottom:3px}
#hudTL .stat b{font-variant-numeric:tabular-nums;font-size:28px;line-height:1;color:var(--ink);display:inline-block;text-align:right}
#hudTL .stat b.neg{color:#c0392b}#hudTL .stat small{font-size:18px}
/* HUD 글자 위치 보정 (조절기 값, 2026-10-26) */
#hudTL #hDate{display:inline-block;transform:translateY(-10px)}
#hudTL .weekbar{transform:translateY(-13px)}
#hudTL #hGrade{transform:translateY(-4px)}
#hudTL .stat b{transform:translateY(-3px)}
#hudTL .stat small{display:inline-block;transform:translateY(-4px)}
#hGold{min-width:9ch}#hTrust,#hFame{min-width:3ch}#hAdv{min-width:2ch}
.weekbar{position:absolute;left:0;right:0;bottom:-16px;height:9px;border-radius:5px;background:#6b4a2e;box-shadow:inset 0 2px 2px rgba(0,0,0,.5);overflow:hidden}
.weekbar i{display:block;height:100%;width:0;background:var(--gold)}
/* 오른쪽 위: 배속·메뉴 */
/* 배속 바: 상단 HUD와 같은 명패 ③ 디자인. 평소에는 일시정지·재생만 보이고, 마우스를 올리면 배속이 펼쳐진다 */
#hudTR{position:absolute;left:18px;bottom:14px;--h:64;height:calc(var(--h)*1px);display:flex;align-items:center;color:var(--ink);z-index:7}
#hudTR .pm{position:absolute;top:0;bottom:0;left:round(calc(var(--h)*.506px),1px);right:round(calc(var(--h)*.506px),1px);background:url(assets/ui/hud/plaque_mid_s.png) 0 0/100% 100% no-repeat} /* 양 끝 이미지 폭을 정수 px로 맞춰 겹침 없이 이어붙임(이중 그림자 방지) */
#hudTR .pl,#hudTR .pr{z-index:1;position:absolute;top:0;height:100%;width:round(calc(var(--h)*.506px),1px);background:url(assets/ui/lina_menu/btn_selected.png) no-repeat;background-size:auto 100%}
#hudTR .pl{left:0;background-position:left top}#hudTR .pr{right:0;background-position:right top}
#hudTR .in{z-index:2;position:relative;display:flex;align-items:center;min-width:calc(var(--h)*1.012px);height:calc(100% - 6px);padding:0 calc(var(--h)*.31px)}
#hudTR .btn{padding:4px 10px;border-radius:10px;font-size:20px;line-height:1;min-width:23px;height:36px;display:grid;place-items:center}
#hudTR #ppBtn{width:23px;min-width:0;padding:0;transform:translateY(-2px)}
#hudTR [data-speed="1"]{transform:translate(12px,-2px)}#hudTR [data-speed="2"]{transform:translate(10px,-2px)}#hudTR [data-speed="4"]{transform:translate(4px,-2px)} /* 일시정지 버튼 가로를 글자 여백이 아닌 값 그대로(36px)로 */
#hudTR #ppBtn svg{width:20px;height:20px;display:block}
#hudTR #ppBtn.paused{background:var(--wood2);color:#fff3d6}
#hudTR .more{display:flex;gap:4px;overflow:hidden;padding:8px 0;margin-top:-8px;margin-bottom:-8px;max-width:0;opacity:0;margin-left:0;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
#hudTR:hover .more,#hudTR:focus-within .more{max-width:200px;opacity:1;margin-left:4px;margin-right:calc(var(--ew,0)*1px)} /* --ew: 펼친 상태에서 오른쪽 추가 폭(px, 음수 가능) */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 16px;background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:rgba(90,58,34,.12)}
.btn.on{background:var(--wood2);color:#fff3d6}
#menu{position:absolute;right:22px;bottom:118px;z-index:7;display:none;flex-direction:column;padding:8px;min-width:280px}
#menu.open{display:flex}
#menu .btn{text-align:left;font-weight:600}
#menu i{font-style:normal;float:right;color:var(--muted)}
/* 알림 */
#toasts{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(255,250,238,.96);border:3px solid var(--wood2);border-radius:16px;padding:8px 20px;font-size:21px;max-width:900px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-10px)}
.toast.k-success{border-color:#3f8f4a}.toast.k-fail,.toast.k-warn{border-color:#c0392b}.toast.k-grow,.toast.k-unlock{border-color:#c8961e}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
/* 오른쪽 아래: 기능 버튼 */
#hudBR{right:22px;bottom:18px;display:flex;gap:6px;padding:8px}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:88px;padding:8px 4px 6px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.mb:hover{background:rgba(90,58,34,.12)}.mb.on{background:var(--wood2);color:#fff3d6}
.mb svg{width:38px;height:38px}
.mb .cnt[hidden]{display:none}
.mb .cnt{position:absolute;right:10px;top:2px;min-width:26px;height:26px;border-radius:13px;background:#c0392b;color:#fff;font-size:15px;display:grid;place-items:center;padding:0 6px}
/* 왼쪽 아래: 개발 */
#devToggle{position:absolute;right:22px;top:18px;padding:6px 14px;font-size:16px}
#dev{z-index:6;right:22px;top:64px;display:none;flex-wrap:wrap;gap:6px;padding:10px;max-width:760px;font-size:17px}
#dev.open{display:flex}
#dev .tag{color:var(--muted);font-size:15px;align-self:center}
/* 팝업 */
#popBack{position:absolute;inset:0;background:rgba(20,12,6,.45);display:none;z-index:4}
#hudBR{z-index:5}
#popBack.open{display:block}
#pop{left:50%;top:46%;transform:translate(-50%,-50%);width:1180px;height:780px;display:flex;flex-direction:column;padding:0;overflow:hidden}
#popHead{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:var(--wood2);color:#fff3d6}
#popTitle{font-size:28px;font-weight:700;margin:0}
#popClose{font-size:26px;color:#fff3d6;padding:2px 14px}
#popBody{flex:1;overflow:auto;padding:20px 30px 30px;font-size:20px}
#popBody h3{font-size:22px;margin:18px 0 10px}
#popBody h3 small{font-weight:400;color:var(--muted);font-size:17px;margin-left:8px}
#popBody table{width:100%;border-collapse:collapse}
#popBody th{text-align:left;font-weight:600;color:var(--muted);font-size:17px;border-bottom:2px solid rgba(90,58,34,.25);padding:6px 8px}
#popBody td{padding:8px;border-bottom:1px solid rgba(90,58,34,.15)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:#c0392b}.pos{color:#2f7d3e}.muted{color:var(--muted)}.ok{color:#2f7d3e;font-weight:600}
.tot td{font-weight:700;border-top:2px solid rgba(90,58,34,.35)}
.flt{display:grid;grid-template-columns:44px 1fr 80px;gap:10px 14px;align-items:center;max-width:720px}
.flt input{width:100%;accent-color:var(--wood2)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fffaf0;border:2px solid rgba(90,58,34,.25);border-radius:12px;padding:10px 14px}
.card .t{display:flex;align-items:center;gap:4px}.card .t .n{margin-left:auto;font-weight:700}
.card .req{color:var(--muted);font-size:17px;margin:6px 0}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.sbtn{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--wood2);background:#fff3d6;color:var(--ink);border-radius:10px;padding:4px 12px;cursor:pointer}
.sbtn:disabled{opacity:.4;cursor:default}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:24px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:14px;color:var(--muted)}
.bar i{display:block;width:100%;background:#5a8f4a;border-radius:6px 6px 0 0}.bar i.neg{background:#c0392b}
tr.adv{cursor:pointer}tr.adv:hover,tr.adv.on{background:rgba(232,180,74,.18)}
.st{font-size:16px;padding:2px 10px;border-radius:10px}.st.town{background:#e3f1df}.st.quest{background:#fbe7c8}.st.away{background:#ece6dc;color:var(--muted)}
.sbars{display:grid;grid-template-columns:60px 1fr 60px;gap:6px 10px;align-items:center;max-width:560px;margin-top:8px;font-size:17px}
.sbars .bg{height:10px;background:rgba(90,58,34,.15);border-radius:5px;overflow:hidden}.sbars i{display:block;height:100%;background:var(--gold)}
.facs{display:grid;grid-template-columns:44px 1fr auto;gap:10px 14px;align-items:center;max-width:760px}
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meal{display:grid;grid-template-columns:40px 1fr;gap:2px 8px;align-items:center;background:#fffaf0;border:2px solid rgba(90,58,34,.2);border-radius:12px;padding:10px 12px}
.meal .muted{grid-column:2;font-size:16px}.meal.lock{opacity:.55}
.log div{padding:6px 0;border-bottom:1px solid rgba(90,58,34,.12);font-size:18px}.log .w{display:inline-block;width:80px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .k-success{color:#2f7d3e}.log .k-fail,.log .k-warn{color:#b03a2e}.log .k-grow,.log .k-unlock{color:#a0761a}
.pill2{padding:3px 12px;border-radius:10px;font-weight:700}.pill2.ok{background:#e3f1df;color:#2f7d3e}.pill2.bad{background:#fbe2df;color:#b03a2e}
/* 리나 대화창 */
#dlg{position:absolute;left:150px;bottom:24px;transform:translateY(20px);width:1080px;height:220px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;cursor:pointer}
#dlg.open{opacity:1;transform:none;pointer-events:auto}
.stage-ui #dlg:not(.open),.stage-ui #dlg:not(.open) *,.stage-ui .toast{pointer-events:none}
#dlgFace{position:absolute;left:-10px;bottom:0;height:470px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
#dlgBox{position:absolute;left:210px;right:0;bottom:0;height:200px;padding:42px 36px 20px 40px;font-size:27px;line-height:1.55}
#dlgName{position:absolute;left:24px;top:-22px;background:var(--wood2);color:#fff3d6;font-weight:700;padding:6px 22px;border-radius:12px;font-size:22px}
#dlgNext{position:absolute;right:26px;bottom:16px;color:var(--wood2);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(5px)}}

#bPromo{right:22px;top:100px;padding:10px 22px;font-size:21px;background:linear-gradient(#fff3c4,#f3d27a);animation:glow 1.6s infinite}
#bPromo[hidden]{display:none}
#bPromo{display:none!important} /* 전직 제안은 리나 메뉴로 옮김 (2026-10-26) */
@keyframes glow{50%{box-shadow:0 6px 0 rgba(58,38,24,.55),0 0 22px rgba(232,180,74,.9)}}
.advwrap{display:grid;grid-template-columns:300px 1fr;gap:18px;height:100%}
#popBody:has(.advwrap){overflow:hidden}
.advlist{overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:6px}
.advrow{display:grid;grid-template-columns:36px 1fr auto;grid-template-rows:auto auto;column-gap:6px;text-align:left;font:inherit;font-size:18px;border:2px solid transparent;background:#fffaf0;border-radius:10px;padding:6px 10px;cursor:pointer}
.advrow .gb{grid-column:1;grid-row:1/3;align-self:center}.advrow .nm{grid-column:2;grid-row:1}.advrow .cl{grid-column:2;grid-row:2;color:var(--muted);font-size:15px}.advrow .n{grid-column:3;grid-row:1/3;align-self:center}
.advrow.on{border-color:var(--wood2);background:#fff3d6}.star{color:#d08a10;font-style:normal}
.advdet{overflow:auto;padding-right:8px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.dn{margin:0 0 4px;font-size:28px}
.lvbox{min-width:300px;text-align:right}.lvbox b{font-size:26px}
.xp{height:10px;background:rgba(90,58,34,.15);border-radius:5px;overflow:hidden;margin:6px 0}.xp i{display:block;height:100%;background:#5a8fd0}
.dgrid{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:10px}
#popBody h4{margin:14px 0 6px;font-size:19px}
.small{font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#fffaf0;border:2px solid rgba(90,58,34,.2);border-radius:10px;padding:8px 10px;font-size:17px}.slot span{display:block;color:var(--muted);font-size:14px}
.skills .skill{background:#fffaf0;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:17px}.skill .muted{display:block;font-size:15px}
.path{display:grid;grid-template-columns:120px 180px 1fr;gap:10px;align-items:center;font-size:17px;padding:4px 0}
.pbar{height:10px;background:rgba(90,58,34,.15);border-radius:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold)}
.career{list-style:none;padding:0;margin:0;font-size:17px}.career li{padding:4px 0;border-bottom:1px solid rgba(90,58,34,.12)}.career .w{display:inline-block;width:150px;color:var(--muted)}
.prop{border:3px solid var(--gold);border-radius:16px;padding:14px 18px;margin-bottom:16px;background:#fffbef}
.ph{display:flex;gap:18px;align-items:center}.ph h3{margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:10px}
.opt{background:#fff;border:2px solid rgba(90,58,34,.25);border-radius:12px;padding:10px 14px;font-size:17px;display:flex;flex-direction:column;gap:5px}
.ot{display:flex;align-items:center;gap:8px;font-size:21px}.tagx{font-size:14px;background:#efe3c8;border-radius:8px;padding:2px 8px;color:var(--muted)}
.sbtn.big{font-size:18px;padding:8px 14px;margin-top:6px;background:var(--wood2);color:#fff3d6}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fbefd6;font-size:18px}
</style></head><body>
<div id="game"></div>
<div id="loading"><span id="loadMsg"></span></div>
<template id="uiTpl">
  <div id="hudTL"><i class="pm"></i><i class="pl"></i><i class="pr"></i><div class="in"><span id="hGrade"></span><span class="dt"><span class="date" id="hDate"></span><div class="weekbar"><i id="hWeekBar"></i></div></span><span class="sep"></span><span class="stat"><img src="assets/ui/hud/icon_coin.png" alt=""><span><span class="lb">금고</span><b id="hGold"></b><small> G</small></span></span><span class="sep"></span><span class="stat" title="의뢰인이 길드를 믿는 정도 (0~100). 매달 들어오는 의뢰 수와 새 모험가 방문 수에 영향"><img src="assets/ui/hud/icon_shield.png" alt=""><span><span class="lb">신뢰도</span><b id="hTrust"></b></span></span><span class="sep"></span><span class="stat" title="길드가 이름난 정도 (0~1,000). 높을수록 새 모험가가 많이 찾아옴 (500에서 최대 1.6배)"><img src="assets/ui/hud/icon_star.png" alt=""><span><span class="lb">명성</span><b id="hFame"></b></span></span><span class="sep"></span><span class="stat"><img src="assets/ui/hud/icon_adventurer.png" alt=""><span><span class="lb">모험가</span><b id="hAdv"></b><small> 명</small></span></span></div></div>
  <div id="hudTR"><i class="pm"></i><i class="pl"></i><i class="pr"></i><div class="in"><button class="btn" id="ppBtn" title="일시정지·재생 (스페이스)"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg></button><span class="more"><button class="btn on" data-speed="1">1×</button><button class="btn" data-speed="2">2×</button><button class="btn" data-speed="4">4×</button></span></div></div>
  <div class="plate" id="menu"><button class="btn" id="mSave">저장하기</button><button class="btn" id="mLoad">불러오기</button><button class="btn" id="mNew">새 게임</button><button class="btn" id="mReport">월간 보고 자동 표시 <i>켬</i></button></div>
  <div id="toasts"></div>
  <button class="plate btn" id="bPromo" hidden>전직 제안</button>
  <div class="plate" id="hudBR">
    <button class="mb" data-pop="board"><svg viewBox="0 0 40 40"><rect x="4" y="6" width="32" height="26" rx="3" fill="#c8995f" stroke="#5a3a22" stroke-width="2.5"/><rect x="9" y="11" width="9" height="12" fill="#fbf4e2"/><rect x="22" y="13" width="9" height="11" fill="#fbf4e2"/><circle cx="13.5" cy="11" r="1.8" fill="#c0392b"/><circle cx="26.5" cy="13" r="1.8" fill="#c0392b"/></svg>게시판<span class="cnt" id="bBoard"></span></button>
