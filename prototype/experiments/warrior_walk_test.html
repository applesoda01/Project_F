<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전사 걷기 시험판</title>
<style>
:root{--bg:#f4efe8;--panel:#fff;--ink:#2b1e15;--muted:#7a6a5a;--accent:#b8763e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1712;--panel:#2a221b;--ink:#efe6da;--muted:#b5a693;--accent:#d9a441}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.wrap{max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:12px;padding:12px;overflow:hidden}
.card h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
.stage{position:relative;width:100%;aspect-ratio:4/5;background:linear-gradient(#6a6a80 78%,#4d4d5e 78%);border-radius:8px;overflow:hidden}
.lobby{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.lobby img.bgimg{position:absolute;left:0;top:0;width:100%}
.rig{position:absolute;left:0;top:0;transform-origin:0 0}
.flip{position:absolute;left:0;top:0}
.rig img{position:absolute;left:0;top:0;user-select:none;pointer-events:none}
.shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.22)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:9px 16px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 0 0 1px rgba(128,110,90,.35) inset}
button.on{background:var(--accent);color:#fff;box-shadow:none}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:14px}
</style></head><body><div class="wrap">
<h1>전사 옆모습 걷기 시험판</h1>
<p class="sub">Gemini로 만든 옆모습 부위 9장(머리 2 · 몸통 · 망토 · 팔 2 · 다리 2 · 검)을 코드로 조립해 걷게 했습니다. 걷기 동작은 그림 없이 코드만으로 만듭니다.</p>
<div class="grid">
 <div class="card"><h2>단독 보기</h2><div class="stage" id="stageA"></div></div>
 <div class="card"><h2>로비 바닥을 오가며 걷기</h2><div class="lobby" id="stageB"><img class="bgimg" id="bgB" alt=""></div></div>
</div>
<div class="ctrl" id="ctrl">
 <button data-m="walk" class="on">걷기</button>
 <button data-m="idle">멈춰 서기</button>
 <button data-m="flip">방향 바꾸기 (단독)</button>
 <button data-m="slow">느리게 보기</button>
</div>
<p class="note">다리·팔은 엉덩이·어깨를 축으로 서로 반대로 흔들고, 앞으로 내딛는 다리는 살짝 들어 올립니다. 몸통은 걸음마다 위아래로 튀고, 망토는 뒤로 날립니다. 왼쪽으로 걸을 때는 같은 그림을 좌우 반전합니다. 앞·뒷모습도 같은 방식으로 시트를 추가하면 됩니다.</p>
</div>

const P={ // rig coordinates, origin = torso top-left
 torso:{x:0,y:0},
 head:{x:-103,y:-258,px:156,py:290}, blink:{x:-103,y:-258,px:156,py:290},
 armN:{x:9,y:35,px:32,py:22}, armF:{x:16,y:37,px:28,py:22},
 legN:{x:17,y:135,px:43,py:22,kx:34.6,ky:131.4}, legF:{x:13,y:132,px:35,py:22,kx:33.3,ky:128.2},
 cape:{x:-58,y:12,px:118,py:8}, sword:{x:-16,y:-21,px:36,py:121}
};
const ORDER=['sword','armF','cape','legF','legN','head','blink','torso','armN']; // head sits behind the collar so the neck tucks in
const RIG_W=360,RIG_H=680,OX=140,OY=270,FOOT=OY+362; // feet line in rig box
function makeRig(parent){
  const r=document.createElement('div');r.className='rig';r.style.width=RIG_W+'px';r.style.height=RIG_H+'px';
  const sh=document.createElement('div');sh.className='shadow';sh.style.left=(OX-20)+'px';sh.style.top=(FOOT-14)+'px';sh.style.width='150px';sh.style.height='26px';r.appendChild(sh);
  const fl=document.createElement('div');fl.className='flip';fl.style.width=RIG_W+'px';fl.style.height=RIG_H+'px';fl.style.transformOrigin=(OX+55)+'px 0';r.appendChild(fl);
  const el={};
  for(const k of ORDER){const p=P[k];
    if(k==='legN'||k==='legF'){ // two-segment leg: thigh + boot, knee joint
      const g=document.createElement('div');g.style.position='absolute';g.style.left=(OX+p.x)+'px';g.style.top=(OY+p.y)+'px';g.style.transformOrigin=p.px+'px '+p.py+'px';
      const u=A[k+'_up'],l=A[k+'_lo'];const iu=document.createElement('img');iu.src=u.src;iu.width=u.w;iu.height=u.h;g.appendChild(iu);
      const il=document.createElement('img');il.src=l.src;il.width=l.w;il.height=l.h;il.style.top=p.ky+'px';il.style.transformOrigin=p.kx+'px 0px';g.appendChild(il);
      fl.appendChild(g);el[k]=g;el[k+'_lo']=il;continue;}
    const a=A[k];const i=document.createElement('img');i.src=a.src;i.width=a.w;i.height=a.h;
    i.style.left=(OX+p.x)+'px';i.style.top=(OY+p.y)+'px';if(p.px!=null)i.style.transformOrigin=p.px+'px '+p.py+'px';fl.appendChild(i);el[k]=i;}
  parent.appendChild(r);return {root:r,fl,el,sh};
}
const sA=document.getElementById('stageA'),sB=document.getElementById('stageB');
document.getElementById('bgB').src=A.lobby.src;
const rigA=makeRig(sA),rigB=makeRig(sB);
let kA=1,kB=1;
function fit(){
  const w=sA.clientWidth,h=sA.clientHeight;kA=Math.min(w/RIG_W,h/RIG_H)*0.92;
  rigA.root.style.transform=`translate(${(w-RIG_W*kA)/2}px,${h*0.86-FOOT*kA}px) scale(${kA})`;
  kB=sB.clientWidth/A.lobby.w*0.29;
}
addEventListener('resize',fit);
let walking=true,slow=false,faceA=1,xB=120,dirB=1,phase=0,last=performance.now(),t0=last,nextBlink=1500,blinkUntil=0;
document.querySelectorAll('#ctrl button').forEach(b=>b.onclick=()=>{const m=b.dataset.m;
  if(m==='walk'||m==='idle'){walking=m==='walk';document.querySelector('[data-m=walk]').classList.toggle('on',walking);document.querySelector('[data-m=idle]').classList.toggle('on',!walking);}
  if(m==='flip')faceA*=-1;
  if(m==='slow'){slow=!slow;b.classList.toggle('on',slow);}
});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let amp=1;
function pose(R,p,a,t,blink,face){
  const e=R.el,s=Math.sin(p),c=Math.cos(p);
  const bob=-Math.abs(c)*6*a, idle=Math.sin(t*2.2)*1.5*(1-a);
  const tf=(x,y,r)=>`translate(${x}px,${y}px) rotate(${r}deg)`;
  const by=bob+idle;
  e.torso.style.transform=tf(0,by,0);
  e.head.style.transform=e.blink.style.transform=tf(0,by,Math.sin(p*2)*1.2*a+Math.sin(t*1.1)*1*(1-a));
  e.head.style.opacity=blink?0:1;e.blink.style.opacity=blink?1:0;
  // hip swing: negative = forward (toward facing). knee bends during the swing phase so the
  // trailing boot lifts heel-first instead of the whole straight leg floating backward.
  const leg=(g,lo,ph)=>{const fs=Math.sin(ph),fc=Math.cos(ph);
    const hip=-fs*24*a, knee=(Math.max(0,fc)*26+Math.max(0,-fs)*6)*a;
    g.style.transform=tf(0,by*0.3,hip);lo.style.transform=`rotate(${knee}deg)`;};
  leg(e.legN,e.legN_lo,p);leg(e.legF,e.legF_lo,p+Math.PI);
  e.armN.style.transform=tf(0,by,s*24*a);
  e.armF.style.transform=tf(0,by,-s*20*a);
  e.cape.style.transform=tf(0,by,(6+Math.sin(p*2)*2.5)*a+Math.sin(t*1.3)*1*(1-a));
  e.sword.style.transform=tf(0,by,-32);
  R.fl.style.transform=`scaleX(${face})`;
  R.sh.style.transform=`scaleX(${1-0.08*Math.abs(c)*a})`;
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  amp+=((walking&&!reduce?1:0)-amp)*Math.min(1,dt*8);
  const rate=(slow?2.5:7.5);
  phase+=dt*rate*amp;
  if(now>nextBlink){blinkUntil=now+130;nextBlink=now+2200+Math.random()*2800}
  const blink=now<blinkUntil;
  pose(rigA,phase,amp,t,blink,faceA);
  // lobby: walk along floor, turn at ends
  const W=A.lobby.w;
  xB+=dirB*dt*rate*amp*14;
  if(xB>W-70){xB=W-70;dirB=-1}if(xB<70){xB=70;dirB=1}
  pose(rigB,phase,amp,t,blink,dirB);
  const k=sB.clientWidth/W;
  rigB.root.style.transform=`translate(${(xB*k-(OX+55)*kB)}px,${(515*k-FOOT*kB)}px) scale(${kB})`;
  requestAnimationFrame(frame);
}
Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>{}):0)).then(()=>{fit();requestAnimationFrame(frame)});
