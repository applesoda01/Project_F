<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리나 컷아웃 시험판</title>
<style>
:root{--bg:#f4efe8;--panel:#fff;--ink:#2b1e15;--muted:#7a6a5a;--accent:#b8763e;--accent2:#3f7d63}
@media (prefers-color-scheme:dark){:root{--bg:#1c1712;--panel:#2a221b;--ink:#efe6da;--muted:#b5a693;--accent:#d9a441;--accent2:#6cc28f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.wrap{max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:12px;padding:12px;overflow:hidden}
.card h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
.stage{position:relative;width:100%;aspect-ratio:4/5;background:#5a5a6e;border-radius:8px;overflow:hidden}
.lobby{position:relative;width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.lobby img.bgimg,.lobby img.ctr{position:absolute;left:0;width:100%}
.rig{position:absolute;left:0;top:0;transform-origin:0 0}
.rig img{position:absolute;left:0;top:0;user-select:none;pointer-events:none}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:9px 16px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 0 0 1px rgba(128,110,90,.35) inset}
button.on{background:var(--accent);color:#fff;box-shadow:none}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:14px}
.bubble{position:absolute;background:#fffdf6;color:#3b2a1e;border:2px solid #5a3a22;border-radius:18px;padding:4px 12px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
</style></head><body><div class="wrap">
<h1>리나 컷아웃 애니메이션 시험판</h1>
<p class="sub">Gemini로 만든 부위 시트(머리 3종 · 몸통 · 팔 4종)를 코드로 조립해 움직입니다. 그림은 8장뿐이고 동작은 전부 코드입니다.</p>
<div class="grid">
 <div class="card"><h2>단독 보기</h2><div class="stage" id="stageA"></div></div>
 <div class="card"><h2>로비 카운터 뒤</h2><div class="lobby" id="stageB"><img class="bgimg" id="bgB" alt=""><div id="slotB"></div><img class="ctr" id="ctrB" alt=""><div class="bubble" id="bub">잠시만요!</div></div></div>
</div>
<div class="ctrl" id="ctrl">
 <button data-m="idle" class="on">대기</button>
 <button data-m="talk">말하기 (월간 보고)</button>
 <button data-m="wave">잠시만요 (손 흔들기)</button>
 <button data-m="paper">의뢰서 건네기</button>
 <button data-m="happy">기뻐하기 (승급)</button>
</div>
<p class="note">대기 중에는 숨쉬기 · 고개 흔들림 · 무작위 눈 깜빡임이 계속 돌아갑니다. 버튼을 누르면 팔을 다른 그림으로 바꾸고 회전·이동을 더해 동작을 만듭니다. 걷기·옆모습·뒷모습은 같은 방식으로 방향별 부위 시트를 추가하면 됩니다.</p>
</div>

const P={ // half-scale rig coordinates, origin = body top-left
 body:{x:0,y:0}, head:{x:-22,y:-243,px:143,py:263},
 armL:{x:-9,y:46,px:55,py:15}, armR:{x:170,y:46,px:22,py:15},
 wave:{x:163.5,y:14,px:22,py:45}, paper:{x:170,y:35,px:20,py:20}
};
const RIG_W=420,RIG_H=780,OX=30,OY=250; // rig box and origin offset
function makeRig(parent){
  const r=document.createElement('div');r.className='rig';r.style.width=RIG_W+'px';r.style.height=RIG_H+'px';
  const el={};
  const add=(k,src,pos)=>{const i=document.createElement('img');i.src=A[src].src;i.width=A[src].w;i.height=A[src].h;
    i.style.left=(OX+pos.x)+'px';i.style.top=(OY+pos.y)+'px';if(pos.px!=null)i.style.transformOrigin=pos.px+'px '+pos.py+'px';r.appendChild(i);el[k]=i;return i};
  add('armL','armL',P.armL);add('armR','armR',P.armR);
  add('wave','wave',P.wave);add('paper','paper',P.paper);add('body','body',P.body);
  add('head','head',P.head);add('blink','blink',P.head);add('talk','talk',P.head);
  parent.appendChild(r);return {root:r,el};
}
const sA=document.getElementById('stageA'),slot=document.getElementById('slotB');
document.getElementById('bgB').src=A.lobby.src;
const ctr=document.getElementById('ctrB');ctr.src=A.counter.src;
const rigA=makeRig(sA),rigB=makeRig(slot);
function fit(){
  const w=sA.clientWidth,h=sA.clientHeight;const s=Math.min(w/RIG_W,h/RIG_H)*0.95;
  rigA.root.style.transform=`translate(${(w-RIG_W*s)/2}px,${(h-RIG_H*s)/2}px) scale(${s})`;
  const L=document.getElementById('stageB');const k=L.clientWidth/A.lobby.w;
  ctr.style.top=(A.counter.y*k)+'px';
  const s2=0.389*k; // lina ~300px tall at 1080p
  rigB.root.style.transform=`translate(${(300-148*0.389)*k}px,${(95-7*0.389)*k}px) scale(${s2})`;
  const b=document.getElementById('bub');b.style.left=(375*k)+'px';b.style.top=(62*k)+'px';b.style.fontSize=Math.max(11,15*k)+'px';
}
addEventListener('resize',fit);
let mode='idle',t0=performance.now(),modeT=0,nextBlink=1500,blinkUntil=0;
document.querySelectorAll('#ctrl button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;modeT=performance.now();
  document.querySelectorAll('#ctrl button').forEach(x=>x.classList.toggle('on',x===b));
  const bub=document.getElementById('bub');bub.textContent={talk:'이번 달 보고드릴게요!',wave:'잠시만요!',paper:'이 의뢰는 어떠세요?',happy:'승급 축하드려요!'}[mode]||'';bub.classList.toggle('show',mode!=='idle');});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
  const t=(now-t0)/1000,mt=(now-modeT)/1000;
  if(now>nextBlink){blinkUntil=now+130;nextBlink=now+2200+Math.random()*2800}
  const blinking=now<blinkUntil;
  for(const R of [rigA,rigB]){
    const e=R.el,amp=reduce?0:1;
    const br=Math.sin(t*2.2)*amp;
    let bodyY=br*2,bodyS=1+br*0.006,headR=Math.sin(t*1.1)*1.5*amp,headY=br*2.5,aL=Math.sin(t*2.2+0.5)*2*amp,aR=-aL,jump=0;
    let showWave=false,showPaper=false,talking=false;
    if(mode==='talk'){talking=Math.floor(now/140)%2===0&&(Math.floor(now/900)%3!==2);headR+=Math.sin(t*4)*1.5*amp}
    if(mode==='wave'){showWave=true;talking=Math.floor(now/160)%2===0&&mt<1.2;}
    if(mode==='paper'){showPaper=true;}
    if(mode==='happy'){jump=-Math.abs(Math.sin(mt*6))*18*Math.max(0,1-mt/2)*amp;aL=-8+Math.sin(t*12)*4*amp;aR=-aL;talking=mt<1.5&&Math.floor(now/160)%2===0}
    const tf=(x,y,r,s)=>`translate(${x}px,${y}px) rotate(${r}deg) scale(${s||1})`;
    e.body.style.transform=`translate(0,${bodyY+jump}px) scaleY(${bodyS})`;e.body.style.transformOrigin='118px 528px';
    const hT=tf(0,headY+jump,headR);
    e.head.style.transform=e.blink.style.transform=e.talk.style.transform=hT;
    e.head.style.opacity=(!blinking&&!talking)?1:0;e.blink.style.opacity=(blinking&&!talking)?1:0;e.talk.style.opacity=talking?1:0;
    e.armL.style.transform=tf(0,bodyY+jump,aL);
    e.armR.style.transform=tf(0,bodyY+jump,aR);e.armR.style.opacity=(showWave||showPaper)?0:1;
    e.wave.style.opacity=showWave?1:0;e.wave.style.transform=tf(0,bodyY,(Math.sin(mt*9)*9-2)*amp);
    const ext=showPaper?Math.min(1,mt*3):0;
    e.paper.style.opacity=showPaper?1:0;e.paper.style.transform=tf(-14+14*ext,bodyY+4-4*ext,(1-ext)*20);
  }
  requestAnimationFrame(frame);
}
Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>{}):0)).then(()=>{fit();requestAnimationFrame(frame)});
